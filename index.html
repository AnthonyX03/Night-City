  html += '<div class="skill-cat-tabs">';
  Object.keys(SKILL_TREE).forEach(function(cat){
    html += '<button class="'+(skillCat===cat?'active':'')+'" style="'+(skillCat===cat?'background:var(--magenta);color:#000;border-color:var(--magenta)':'')+'" onclick="skillCat=\''+cat+'\';render()">'+SKILL_TREE[cat].name+'</button>';
  });
  html += '</div>';
  var tree = SKILL_TREE[skillCat];
  tree.nodes.forEach(function(n){
    var unlocked = isSkillUnlocked(n.id);
    var can = canUnlockSkill(n);
    var locked = !unlocked && !can;
    html += '<div class="skill-node '+(unlocked?'unlocked':locked?'locked':'')+'">'+
      '<div class="sk-name">'+n.name+(unlocked?' ✓':'')+'</div>'+
      '<div class="sk-desc">'+n.desc+'</div>'+
      '<div style="font-size:11px;color:var(--gold)">Coste: '+n.cost+' pt'+(n.cost>1?'s':'')+(n.req?' · Requiere: '+n.req:'')+'</div>';
    if (unlocked) html += '<div style="margin-top:6px;font-size:11px;color:var(--green)">Desbloqueada</div>';
    else if (can) html += '<div style="margin-top:8px"><button class="magenta" onclick="unlockSkill(\''+n.id+'\')">Desbloquear</button></div>';
    else html += '<div style="margin-top:6px;font-size:11px;color:var(--muted)">Bloqueada</div>';
    html += '</div>';
  });
  html += '<p style="font-size:11px;color:var(--muted);margin-top:12px">Ganas 1 punto de habilidad al subir de nivel.</p>';
  main.innerHTML = html;
}

function renderApt(main) {
  seedPcIfNeeded();
  checkDeliveries();
  var subs = [{id:'rest',label:'Hogar'},{id:'pc',label:'PC'},{id:'storage',label:'Almacén'}];
  var html = '<div class="subtabs">'+subs.map(function(s){
    return '<button class="'+(aptSub===s.id?'active':'')+'" onclick="aptSub=\''+s.id+'\';render()">'+s.label+'</button>';
  }).join('')+'</div>';

  if (aptSub === 'pc') {
    var pages = [
      {id:'home',label:'Inicio'},{id:'news',label:'Noticias'},{id:'mail',label:'Mensajes'},
      {id:'biz',label:'Negocios'},{id:'food',label:'Comida'},{id:'joy',label:'Joytoy'}
    ];
    html += '<div class="pc-shell"><div class="pc-bar">'+pages.map(function(pg){
      return '<button class="'+(pcPage===pg.id?'active':'')+'" onclick="pcPage=\''+pg.id+'\';render()">'+pg.label+'</button>';
    }).join('')+'</div>';
    html += '<div style="font-size:10px;color:var(--muted);margin-bottom:8px">'+formatDate()+' · '+String(P.hours).padStart(2,'0')+':'+String(P.minutes).padStart(2,'0')+' · NET // LOCAL</div>';

    if (pcPage === 'home') {
      var unread = (P.pcMessages||[]).filter(function(m){ return !m.read; }).length;
      html += '<div class="loc-flavor">Terminal doméstico. Noticias, pedidos y contactos sin salir del piso.</div>';
      html += '<div class="char-stats">'+
        '<div class="char-stat"><div class="label">Mensajes</div><div class="value">'+(P.pcMessages||[]).length+(unread?' <span style="color:var(--magenta);font-size:12px">('+unread+' nuevos)</span>':'')+'</div></div>'+
        '<div class="char-stat"><div class="label">Noticias</div><div class="value">'+(P.pcNews||[]).length+'</div></div></div>';
      if (P.foodOrder) {
        var left = Math.max(0, P.foodOrder.readyAt - totalMinutes());
        html += '<div class="order-status">Comida en camino: '+P.foodOrder.name+' (~'+left+' min)</div>';
      }
      if (P.joyOrder) {
        var left2 = Math.max(0, P.joyOrder.readyAt - totalMinutes());
        html += '<div class="order-status">Cita en curso: '+P.joyOrder.name+' (~'+left2+' min)</div>';
      }
      html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">Usa las pestañas del PC para navegar.</div>';
    } else if (pcPage === 'news') {
      html += '<div class="action-row"><button onclick="refreshNews()">Actualizar feed</button></div>';
      (P.pcNews||[]).forEach(function(n){
        html += '<div class="pc-news-item"><div class="n-title">'+n.title+'</div><div class="n-date">'+n.date+'</div><div class="n-body">'+n.body+'</div></div>';
      });
    } else if (pcPage === 'mail') {
      html += '<div class="action-row"><button class="ghost" onclick="markMessagesRead()">Marcar leídos</button></div>';
      if (!(P.pcMessages||[]).length) html += '<div class="empty-state">Bandeja vacía.</div>';
      (P.pcMessages||[]).forEach(function(m){
        html += '<div class="pc-msg-item'+(m.read?'':' unread')+'"><div class="m-from">De: <b>'+m.from+'</b> · '+m.date+'</div><div class="m-text">'+m.text+'</div></div>';
      });
    } else if (pcPage === 'biz') {
      html += '<p style="font-size:12px;color:var(--muted)">Micro-negocios desde el piso. Riesgo tuyo.</p>';
      PC_BIZ.forEach(function(b){
        html += '<div class="craft-recipe"><div class="item-name">'+b.name+'</div><div class="item-meta">'+b.desc+'</div>'+
          '<div class="item-actions" style="margin-top:8px"><button class="gold" onclick="doPcBiz(\''+b.id+'\')">Pagar '+b.cost+' €$</button></div></div>';
      });
    } else if (pcPage === 'food') {
      if (P.foodOrder) {
        var leftf = Math.max(0, P.foodOrder.readyAt - totalMinutes());
        html += '<div class="order-status">En camino: '+P.foodOrder.name+' · queda ~'+leftf+' min. Explora o descansa para avanzar el tiempo.</div>';
      }
      FOOD_MENU.forEach(function(f){
        html += '<div class="craft-recipe"><div class="item-name">'+f.name+'</div><div class="item-meta">'+f.desc+' · +'+f.heal+' HP · espera '+f.wait+' min</div>'+
          '<div class="item-actions" style="margin-top:8px"><button class="green" onclick="orderFood(\''+f.id+'\')">Pedir · '+f.cost+' €$</button></div></div>';
      });
    } else if (pcPage === 'joy') {
      if (P.joyOrder) {
        var leftj = Math.max(0, P.joyOrder.readyAt - totalMinutes());
        html += '<div class="order-status">Cita: '+P.joyOrder.name+' · ~'+leftj+' min restantes.</div>';
      }
      JOYTOY_MENU.forEach(function(j){
        html += '<div class="craft-recipe"><div class="item-name">'+j.name+'</div><div class="item-meta">'+j.desc+' · +'+j.heal+' HP · '+j.wait+' min</div>'+
          '<div class="item-actions" style="margin-top:8px"><button class="magenta" onclick="orderJoytoy(\''+j.id+'\')">Contratar · '+j.cost+' €$</button></div></div>';
      });
    }
    html += '</div>';
    main.innerHTML = html;
    return;
  }

  if (aptSub === 'rest') {
    html += '<div class="loc-flavor">Tu apartamento en Watson. Persianas, neones y un PC zumbando. Aquí haces vida: descansas, pides comida, lees el net.</div>'+
      '<div class="action-row"><button class="green" onclick="restAtApartment()">Descansar (HP máximo)</button></div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:8px">Avanza varias horas. Los pedidos del PC también progresan.</div>';
    if (P.foodOrder) html += '<div class="order-status">Comida en camino: '+P.foodOrder.name+'</div>';
    if (P.joyOrder) html += '<div class="order-status">Cita pendiente: '+P.joyOrder.name+'</div>';
    html += '<div class="section-label">Tu estado</div>'+
      '<div class="char-stats">'+
      '<div class="char-stat"><div class="label">Nombre</div><div class="value" style="font-size:16px">'+P.name+'</div></div>'+
      '<div class="char-stat"><div class="label">Nivel</div><div class="value">'+P.lvl+'</div></div>'+
      '<div class="char-stat"><div class="label">Daño</div><div class="value">'+getWeaponDmg()+'</div></div>'+
      '<div class="char-stat"><div class="label">Defensa</div><div class="value">'+getArmorDef()+'</div></div></div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:10px">Fecha: '+formatDate()+' · '+String(P.hours).padStart(2,'0')+':'+String(P.minutes).padStart(2,'0')+'</div>';
  } else {
    var stFilters = [{id:'all',label:'Todo'},{id:'weapon',label:'Armas'},{id:'armor',label:'Atuendos'},{id:'consumable',label:'Curativos'},{id:'cyberware',label:'Chrome'}];
    if (!window._storageSub) window._storageSub = 'all';
    html += '<div class="subtabs">'+stFilters.map(function(f){
      return '<button class="'+(_storageSub===f.id?'active':'')+'" onclick="_storageSub=\''+f.id+'\';render()">'+f.label+'</button>';
    }).join('')+'</div>';
    normalizeInv();
    var items = P.storage.map(function(s){ return {id:s.id, qty:s.qty, def:itemById(s.id)}; }).filter(function(x){ return x.def; });
    if (_storageSub !== 'all') items = items.filter(function(x){ return x.def.type === _storageSub; });
    if (!items.length) html += '<div class="empty-state">Almacén vacío. Desde el inventario usa «Al almacén».</div>';
    else {
      html += '<div class="item-list">';
      items.forEach(function(slot){
        var def = slot.def;
        html += '<div class="item-card"><div class="item-card-top"><div>'+
          '<div class="item-name '+rarityClass(def.rarity)+'">'+def.name+(slot.qty>1?' ×'+slot.qty:'')+'</div>'+
          '<div class="item-meta">'+def.desc+'</div></div></div>'+
          '<div class="item-actions"><button onclick="moveFromStorage('+slot.id+')">Sacar</button>'+
          '<button class="gold" onclick="sellItem('+slot.id+', true)">Vender</button></div></div>';
      });
      html += '</div>';
    }
  }
  main.innerHTML = html;
}


function renderShop(main) {
  var sections = [
    {id:'weapon', title:'Armas', ids:SHOP_WEAPONS},
    {id:'armor', title:'Torso', ids:SHOP_ARMOR},
    {id:'clothes', title:'Ropa', ids:[70,71,72,73,74,75,76,77,78,79,80,81,82,83]},
    {id:'consumable', title:'Curativos', ids:SHOP_CONSUMABLES},
    {id:'ammo', title:'Munición', ids:[210,211,212,213]},
    {id:'cyberware', title:'Chrome', ids:CHROME_SHOP},
    {id:'quickhack', title:'Hacks', ids:[300,301,302,303,304,305,306]}
  ];
  var html = '<div style="font-size:13px;color:var(--gold);margin-bottom:4px;font-weight:700">✦ Mercado negro</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Hierro, ropa, balas y estimulantes. Sin preguntas.</div>';
  html += '<div class="subtabs">'+sections.map(function(s){
    return '<button class="'+(shopSub===s.id?'active':'')+'" onclick="shopSub=\''+s.id+'\';render()">'+s.title+'</button>';
  }).join('')+'</div><div class="item-list">';
  var sec = sections.find(function(s){ return s.id === shopSub; }) || sections[0];
  sec.ids.forEach(function(id){
    var def = itemById(id); if (!def) return;
    var buyQty = def.type==='ammo' ? 20 : 1;
    var price = itemPrice(def, buyQty);
    var chips = def.type==='weapon'
      ? '<span class="stat-chip">DMG '+def.dmg+'</span><span class="stat-chip">'+def.subtype+'</span>'
      : def.type==='armor'
      ? '<span class="stat-chip">DEF '+def.def+'</span>'
      : def.type==='ammo'
      ? '<span class="stat-chip">×'+buyQty+'</span>'
      : '<span class="stat-chip">+'+def.heal+' HP</span>';
    chips += '<span class="stat-chip">'+price+' €$</span>';
    html += '<div class="item-card"><div class="item-card-top"><div>'+
      '<div class="item-name '+rarityClass(def.rarity)+'">'+def.name+(buyQty>1?' ×'+buyQty:'')+'</div>'+
      '<div class="item-meta">'+def.desc+'</div>'+
      '<div class="item-stats-row">'+chips+'</div></div></div>'+
      '<div class="item-actions"><button class="gold" onclick="buyItem('+id+','+buyQty+')">Comprar</button></div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
}

/* Events */
document.getElementById('tabs').addEventListener('click', function(e){
  var btn = e.target.closest('button[data-tab]');
  if (!btn || P.combat) return; sfxTab(); currentTab = btn.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===currentTab); });
  render();
});
document.getElementById('btn-settings').addEventListener('click', function(){
  sfxClick(); document.getElementById('vol-sfx').value = Math.round(sfxVol*100);
  document.getElementById('modal-settings').classList.remove('hidden');
});
document.getElementById('btn-close-settings').addEventListener('click', function(){ sfxClick(); document.getElementById('modal-settings').classList.add('hidden'); });
document.getElementById('vol-sfx').addEventListener('input', function(e){
  sfxVol = e.target.value/100; try{ localStorage.setItem('nightcity_vol', sfxVol); }catch(err){}
});
document.getElementById('btn-save').addEventListener('click', function(){
  if (save()) { sfxBuy(); logMsg('Partida guardada.', 'sys'); } else { sfxError(); logMsg('Error al guardar.', 'sys'); }
});
document.getElementById('btn-load').addEventListener('click', function(){
  if (load()) { sfxClick(); logMsg('Partida cargada.', 'sys'); document.getElementById('modal-settings').classList.add('hidden'); document.getElementById('modal-name').classList.add('hidden'); render(); }
  else { sfxError(); logMsg('No hay partida guardada.', 'sys'); }
});
document.getElementById('btn-reset').addEventListener('click', function(){
  if (confirm('¿Reiniciar partida?')) {
    ['nightcity_v015','nightcity_v010','nightcity_v009','nightcity_v008','nightcity_v007','nightcity_v006','nightcity_v005'].forEach(function(k){ localStorage.removeItem(k); });
    location.reload();
  }
});
document.getElementById('btn-theme').addEventListener('click', function(){
  sfxClick();
  document.documentElement.classList.toggle('theme-afterlife');
  var on = document.documentElement.classList.contains('theme-afterlife');
  try { localStorage.setItem('nightcity_theme', on ? 'afterlife' : 'default'); } catch(e){}
  this.textContent = on ? 'Desactivar' : 'Activar';
  logMsg(on ? 'Tema Afterlife activado.' : 'Tema estándar restaurado.', 'sys');
});
document.getElementById('btn-start').addEventListener('click', function(){
  var name = (document.getElementById('input-name').value.trim() || 'Runner').slice(0,16);
  P.name = name; P.named = true; P.activeQuests = []; P.completedQuests = [];
  P.skillPoints = 0; P.unlockedSkills = [];
  P.mapView = 'city'; P.viewDistrict = null; P.viewSub = null;
  P.style = selectedStyle || 'streetkid';
  P.streetCred = 0; P.diary = [];
  recalcMaxHp(); P.hp = P.maxHp;
  sfxLevel();
  document.getElementById('modal-name').classList.add('hidden');
  var st = RUNNER_STYLES[P.style];
  logMsg('Bienvenido a Night City, '+P.name+' · '+((st&&st.name)||'Runner')+'.', 'sys');
  logMsg('Entra en un distrito, elige subdistrito y explora. Cuidado con la munición.', 'sys');
  save(); render();
});
document.getElementById('input-name').addEventListener('keydown', function(e){ if (e.key==='Enter') document.getElementById('btn-start').click(); });
document.getElementById('btn-loot-all').addEventListener('click', function(){ sfxClick(); takeAllLoot(); });
document.getElementById('btn-loot-leave').addEventListener('click', function(){ sfxClick(); closeLootModal(); });

(function init(){
  try { var v = localStorage.getItem('nightcity_vol'); if (v!==null) sfxVol = parseFloat(v); } catch(e){}
  try {
    if (localStorage.getItem('nightcity_theme') === 'afterlife') {
      document.documentElement.classList.add('theme-afterlife');
      var tb = document.getElementById('btn-theme'); if (tb) tb.textContent = 'Desactivar';
    }
  } catch(e){}
  var verEl = document.getElementById('settings-version');
  if (verEl) verEl.textContent = VERSION;
  var hasSave = load();
  if (hasSave && P.named && P.name) {
    document.getElementById('modal-name').classList.add('hidden');
    if (!P.log.length) logMsg('De vuelta en las calles, '+P.name+'.', 'sys');
    if (P.pendingLoot) openLootModal();
    render();
  } else {
    document.getElementById('modal-name').classList.remove('hidden');
    P.named = false;
  }
  updateStats();
  setInterval(save, 20000);
})();
</script>
