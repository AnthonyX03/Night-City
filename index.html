<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Night City">
<meta name="description" content="Night City — supervivencia en las calles. Offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Night City</title>
<style>
:root {
  --bg: #050508; --panel: #0b0d14; --line: #00e8ff; --txt: #e8eefc;
  --accent: #00e8ff; --magenta: #ff2bd6; --danger: #ff3355; --gold: #ffc933;
  --bar-bg: #101018; --purple: #b14dff; --green: #3dde7a; --muted: #9aacc4;
  --card: #0a101a; --border: #1a2838; --glow: rgba(0,232,255,0.35);
}
/* Afterlife theme */
html.theme-afterlife {
  --bg: #0a0610; --panel: #120a18; --line: #ff2bd6; --txt: #f0e8ff;
  --accent: #ff2bd6; --magenta: #c44dff; --danger: #ff4466; --gold: #ffc933;
  --bar-bg: #180e22; --purple: #d070ff; --green: #5dffb0; --muted: #b09abc;
  --card: #140c1c; --border: #2a1838; --glow: rgba(255,43,214,0.4);
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0;
  background: var(--bg); color: var(--txt);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  letter-spacing: 0.2px;
}
button {
  font: inherit; color: var(--accent); background: #0a1520;
  border: 1px solid rgba(0,232,255,0.45); padding: 9px 12px; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  font-size: 12px; border-radius: 6px; transition: background .12s, transform .08s, box-shadow .12s;
}
button:active { background: #0e2a3a; transform: scale(0.97); }
button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
button.danger { border-color: var(--danger); color: var(--danger); }
button.magenta { border-color: var(--magenta); color: var(--magenta); }
button.gold { border-color: var(--gold); color: var(--gold); }
button.green { border-color: var(--green); color: var(--green); }
button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }

.app {
  display: flex; flex-direction: column; height: 100%; height: 100dvh;
  max-width: 720px; margin: 0 auto; padding: 8px;
  padding-bottom: max(8px, env(safe-area-inset-bottom)); overflow: hidden; position: relative;
}

/* ===== HUD (Pip-Boy / agent) ===== */
.hud {
  flex-shrink: 0; background: linear-gradient(180deg, #0c1018 0%, #080a10 100%);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px 8px;
  margin-bottom: 6px; position: relative; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 18px var(--glow);
}
.hud::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
  opacity: 0.55; border-radius: 8px;
}
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; position: relative; z-index: 1; }
.hud-title {
  margin: 0; font-size: 15px; letter-spacing: 3px; font-weight: 800;
  color: var(--accent); text-shadow: 0 0 12px var(--glow);
}
.hud {
  border-color: #1e3048;
}
.hud-loc {
  font-size: 10px; color: var(--muted); margin-bottom: 6px; position: relative; z-index: 1;
  letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hud-loc b { color: var(--accent); font-weight: 600; }
.hud-loc .faction { color: var(--magenta); }
.hud-right { display: flex; align-items: center; gap: 8px; }
.hud-time { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; max-width: 120px; text-align: right; line-height: 1.2; }
.btn-icon {
  width: 34px; height: 34px; min-width: 34px; padding: 0; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.hud-bars { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; position: relative; z-index: 1; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 11px; color: var(--muted); width: 22px; flex-shrink: 0; font-weight: 700; }
.bar-track {
  flex: 1; height: 10px; background: var(--bar-bg); border-radius: 2px;
  overflow: hidden; border: 1px solid var(--border);
}
.bar-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.bar-fill.hp { background: linear-gradient(90deg, #00a8c8, var(--accent)); box-shadow: 0 0 8px var(--glow); }
.bar-fill.xp { background: linear-gradient(90deg, #a020a0, var(--magenta)); }
.bar-text { font-size: 10px; color: var(--txt); width: 64px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.hud-stats {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  position: relative; z-index: 1;
}
.hud-stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 2px; text-align: center;
}
.hud-stat .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0; }
.hud-stat .val { font-size: 13px; font-weight: 700; margin-top: 1px; }
.hud-stat .val.gold { color: var(--gold); }
.hud-stat .val.accent { color: var(--accent); }
.hud-stat .val.magenta { color: var(--magenta); }
.hud-stat .val.green { color: var(--green); }
.hud-ammo {
  margin-top: 6px; font-size: 11px; color: var(--accent); position: relative; z-index: 1;
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
  border-top: 1px solid var(--border); padding-top: 5px;
}
.hud-ammo .ammo-empty { color: var(--danger); }
.hud-ammo .ammo-melee { color: var(--green); }

/* Apartment PC */
.pc-shell {
  background: #06080e; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; min-height: 200px;
}
.pc-bar {
  display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px;
  border-bottom: 1px solid var(--border); padding-bottom: 8px;
}
.pc-bar button { font-size: 10px; padding: 6px 8px; }
.pc-bar button.active { background: var(--accent); color: #000; border-color: var(--accent); }
.pc-news-item, .pc-msg-item {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; margin-bottom: 8px;
}
.pc-news-item .n-title { font-weight: 700; color: var(--accent); font-size: 13px; }
.pc-news-item .n-date, .pc-msg-item .m-from { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pc-news-item .n-body, .pc-msg-item .m-text { font-size: 12px; margin-top: 6px; color: var(--txt); }
.pc-msg-item.unread { border-color: var(--magenta); }
.order-status {
  font-size: 11px; color: var(--gold); margin: 8px 0; padding: 8px;
  background: #12100a; border-radius: 6px; border: 1px solid #3a3020;
}

/* Combat feedback */
.screen-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 250;
  opacity: 0; transition: opacity 0.05s;
}
.screen-flash.hurt { background: rgba(255,40,60,0.35); }
.screen-flash.crit { background: rgba(255,200,40,0.25); }
.screen-flash.loot { background: rgba(255,200,50,0.18); }
.float-dmg {
  position: fixed; z-index: 260; pointer-events: none;
  font-weight: 800; font-size: 22px; font-family: inherit;
  text-shadow: 0 0 8px #000, 0 2px 0 #000;
  animation: floatDmg 1s ease-out forwards;
}
.float-dmg.player { color: #ff4466; }
.float-dmg.enemy { color: #ffe566; }
.float-dmg.crit { color: #ffaa00; font-size: 26px; }
@keyframes floatDmg {
  0% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -48px) scale(0.9); }
}
.main-content { transition: opacity 0.15s ease; }
.main-content.fading { opacity: 0; }

/* Loot modal */
.loot-modal-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; max-height: 40vh; overflow-y: auto; }
.loot-item-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
}
.loot-item-row .loot-name { font-weight: 700; font-size: 13px; }
.loot-item-row .loot-meta { font-size: 11px; color: var(--muted); }

/* Skill tree */
.skill-cat-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.skill-node {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px;
}
.skill-node.unlocked { border-color: var(--green); box-shadow: 0 0 8px rgba(61,222,122,0.15); }
.skill-node.locked { opacity: 0.55; }
.skill-node .sk-name { font-weight: 700; font-size: 13px; color: var(--accent); }
.skill-node .sk-desc { font-size: 11px; color: var(--muted); margin: 4px 0; }
.skill-points-badge {
  display: inline-block; background: #1a1030; border: 1px solid var(--magenta);
  color: var(--magenta); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 20px;
}

/* Craft */
.craft-recipe {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px;
}
.comp-bar {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
}
.comp-chip {
  font-size: 11px; padding: 6px 10px; border-radius: 8px;
  background: #0e1824; border: 1px solid var(--border); font-weight: 600;
}

/* Eddie transfer animation (CP style) */
.eddie-transfer {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 300; pointer-events: none; text-align: center;
  font-family: 'Segoe UI', monospace; font-weight: 800;
  animation: eddiePop 1.1s ease-out forwards;
}
.eddie-transfer .eddie-label {
  font-size: 11px; letter-spacing: 3px; color: #ffcc33;
  text-transform: uppercase; margin-bottom: 4px;
  text-shadow: 0 0 12px rgba(255,200,0,0.9), 0 0 24px rgba(255,180,0,0.5);
}
.eddie-transfer .eddie-amount {
  font-size: 30px; color: #ffe566;
  text-shadow: 0 0 20px rgba(255,200,0,0.95), 0 0 8px #ffaa00, 0 0 2px #000;
}
.eddie-transfer.spend .eddie-label { color: #ffb020; }
.eddie-transfer.spend .eddie-amount {
  color: #ff9900;
  text-shadow: 0 0 18px rgba(255,140,0,0.9), 0 0 6px #000;
}
.eddie-transfer .eddie-bar {
  width: 150px; height: 4px; margin: 8px auto 0;
  background: #2a2010; border-radius: 2px; overflow: hidden;
  box-shadow: 0 0 8px rgba(255,180,0,0.3);
}
.eddie-transfer .eddie-bar-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, #ffaa00, #ffe566, #ffcc33);
  animation: eddieBar 0.9s ease-out forwards;
  box-shadow: 0 0 10px rgba(255,200,0,0.8);
}
.eddie-transfer.spend .eddie-bar-fill {
  background: linear-gradient(90deg, #cc7700, #ffaa00);
}
@keyframes eddiePop {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
}
@keyframes eddieBar {
  0% { width: 0; }
  100% { width: 100%; }
}
.ammo-row {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  margin: 8px 0; font-size: 11px;
}
.ammo-chip {
  padding: 4px 8px; border-radius: 6px; background: #0e1824;
  border: 1px solid var(--border); color: var(--accent); font-weight: 600;
}
.ammo-chip.empty { color: var(--danger); border-color: #5a2030; }
.sub-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px; cursor: pointer;
}
.sub-card:active { border-color: var(--accent); }
.sub-faction { font-size: 11px; color: var(--magenta); margin-top: 4px; font-weight: 600; }
.hud-stat .val.gold { font-variant-numeric: tabular-nums; }

/* Log */
.panel-log {
  flex-shrink: 0; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; max-height: 72px; overflow-y: auto;
}
.log-title { font-weight: 700; color: var(--accent); font-size: 10px; letter-spacing: 1px; margin-bottom: 2px; }
#log { font-size: 11px; line-height: 1.4; color: #a8b8d0; }
#log .sys { color: var(--accent); } #log .combat { color: var(--danger); }
#log .loot { color: var(--gold); } #log .quest { color: var(--magenta); }

/* Main */
.panel-main {
  flex: 1 1 auto; min-height: 0; overflow: hidden; margin-bottom: 6px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column;
}
.main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }

/* Tabs */
.bottom-bar { flex-shrink: 0; }
.tabs {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
}
.tabs button {
  padding: 10px 0; font-size: 8px; font-weight: 600; border-radius: 6px;
  border-color: var(--border); color: var(--muted); background: #0a0e16;
}
.tabs button.active {
  background: var(--accent); color: #000; border-color: var(--accent);
  box-shadow: 0 0 14px var(--glow); font-weight: 800;
}
.tabs button:not(.active) { box-shadow: none; }

/* Map */
.loc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.loc-title { font-size: 15px; font-weight: 700; color: var(--accent); }
.loc-flavor { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
.action-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.action-row button { flex: 1; min-width: 110px; padding: 12px 10px; font-weight: 600; }
.section-label { font-size: 11px; color: var(--accent); margin: 14px 0 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.district-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.district-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 10px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.district-card.current { border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,43,214,0.2); }
.district-name { font-weight: 700; color: var(--accent); font-size: 13px; }
.district-desc { font-size: 11px; color: var(--muted); margin-top: 4px; }
.district-danger { font-size: 10px; margin-top: 6px; }
.danger-low { color: var(--green); } .danger-mid { color: var(--gold); } .danger-high { color: var(--danger); }

/* Inventory — larger cards */
.subtabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.subtabs button {
  padding: 8px 12px; font-size: 11px; border-radius: 20px; font-weight: 600;
  border-color: var(--border); color: var(--muted); background: #0a0e16;
}
.subtabs button.active { background: var(--magenta); color: #000; border-color: var(--magenta); }
.equipped-bar {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.equipped-slot {
  background: var(--card); border: 1px solid rgba(0,232,255,0.3); border-radius: 8px; padding: 10px;
}
.equipped-slot .slot-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.equipped-slot .slot-name { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 3px; }
.equipped-slot .slot-stats { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-list { display: flex; flex-direction: column; gap: 8px; }
.item-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.item-card.equipped-item { border-color: rgba(0,232,255,0.4); }
.item-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-name { font-weight: 700; font-size: 14px; }
.item-meta { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.item-stats-row {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
}
.stat-chip {
  font-size: 10px; padding: 3px 8px; border-radius: 12px;
  background: #0e1824; border: 1px solid var(--border); color: var(--accent); font-weight: 600;
}
.item-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.item-actions button { padding: 8px 12px; font-size: 11px; font-weight: 600; border-radius: 6px; }
.equipped-tag {
  display: inline-block; font-size: 9px; padding: 2px 6px; margin-left: 6px;
  border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; font-weight: 700;
  vertical-align: middle;
}
.rarity-common { color: #5a6878; }
.rarity-uncommon { color: #3dde7a; text-shadow: 0 0 6px rgba(61,222,122,0.25); }
.rarity-rare { color: #5ba3ff; text-shadow: 0 0 8px rgba(91,163,255,0.35); }
.rarity-epic { color: #d070ff; text-shadow: 0 0 10px rgba(176,80,255,0.45); }
.rarity-legendary {
  color: #ffd24a;
  text-shadow: 0 0 10px rgba(255,200,40,0.7), 0 0 20px rgba(255,180,0,0.4);
  animation: legPulse 1.8s ease-in-out infinite;
}
@keyframes legPulse {
  0%, 100% { text-shadow: 0 0 8px rgba(255,200,40,0.5), 0 0 16px rgba(255,180,0,0.25); }
  50% { text-shadow: 0 0 14px rgba(255,220,80,0.95), 0 0 28px rgba(255,180,0,0.55); }
}

/* Chrome silhouette */
.chrome-layout { display: flex; flex-direction: column; gap: 14px; }
.chrome-silhouette-wrap { display: flex; justify-content: center; padding: 8px 0; }
.chrome-body {
  position: relative; width: 200px; height: 320px;
}
.body-svg { width: 100%; height: 100%; }
.chrome-slot {
  position: absolute; width: 78px; min-height: 48px;
  background: rgba(8,14,24,0.96); border: 1.5px solid #2a3a50;
  border-radius: 8px; padding: 5px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; transition: border-color .15s, box-shadow .15s;
  font-size: 10px; color: #c8d8f0;
}
.chrome-slot.filled {
  border-color: var(--accent); box-shadow: 0 0 10px rgba(0,232,255,0.25); color: var(--accent);
}
.chrome-slot .slot-title { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #8a9bb0; margin-bottom: 2px; }
.chrome-slot .slot-item { font-size: 11px; font-weight: 700; line-height: 1.2; color: #e8eefc; }
.chrome-slot.empty:active, .chrome-slot:active { border-color: var(--magenta); }
.slot-eyes { top: 4px; left: 50%; transform: translateX(-50%); width: 88px; }
.slot-hand-l { top: 110px; left: 0; width: 70px; }
.slot-hand-r { top: 110px; right: 0; width: 70px; }
.slot-chest { top: 70px; left: 50%; transform: translateX(-50%); width: 88px; }
.slot-leg-l { top: 200px; left: 8px; width: 70px; }
.slot-leg-r { top: 200px; right: 8px; width: 70px; }
.slot-chip { top: 270px; left: 50%; transform: translateX(-50%); width: 100px; border-color: var(--magenta); }
.equip-layout { display: flex; flex-direction: column; gap: 10px; }
.equip-weapon-bar {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  cursor: pointer;
}
.equip-weapon-bar:active { border-color: var(--accent); }
.equip-weapon-bar .ew-label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.equip-weapon-bar .ew-name { font-size: 14px; font-weight: 700; color: var(--accent); }
.equip-weapon-bar .ew-stats { font-size: 12px; color: var(--gold); }
.equip-body {
  position: relative; width: 240px; height: 360px; margin: 0 auto;
  background:
    radial-gradient(ellipse 40% 30% at 50% 18%, rgba(0,232,255,0.08), transparent),
    radial-gradient(ellipse at center, rgba(0,30,50,0.5) 0%, #060a10 75%);
  border: 1px solid #1e3048; border-radius: 14px;
  box-shadow: inset 0 0 40px rgba(0,232,255,0.06);
}
.equip-body .body-svg {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 58%; height: 88%;
  pointer-events: none; z-index: 1;
}
.chrome-silhouette-wrap { display: flex; justify-content: center; margin: 8px 0; }
.chrome-body {
  position: relative; width: 240px; height: 360px;

  border: 1px solid #1e3048; border-radius: 14px;
  box-shadow: inset 0 0 40px rgba(0,232,255,0.06);
}
.chrome-body .body-svg {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -48%);
  width: 55%; height: 82%;
  pointer-events: none; z-index: 1;
}
.hud-extra {
  display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px;
  position: relative; z-index: 1;
}
.hud-chip {
  font-size: 10px; padding: 3px 8px; border-radius: 6px;

}
.hud-chip b { color: var(--accent); }
.hud-chip.warn { border-color: #5a2030; color: var(--danger); }
.hud-chip.ok { border-color: rgba(61,222,122,0.35); color: var(--green); }

.equip-slot {
  position: absolute; width: 86px; min-height: 52px;
  background: rgba(8,14,24,0.95); border: 1.5px solid #2a3a50;
  border-radius: 10px; padding: 7px 6px; cursor: pointer; text-align: center;

}
.equip-slot.filled { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(0,232,255,0.2); }
.equip-slot .es-title { font-size: 9px; text-transform: uppercase; color: #8a9bb0; letter-spacing: 0.4px; }
.equip-slot .es-name { font-size: 11px; font-weight: 700; margin-top: 3px; line-height: 1.2; color: inherit; }
.es-hat { top: 8px; left: 50%; transform: translateX(-50%); width: 92px; }
.es-glasses { top: 68px; left: 50%; transform: translateX(-50%); width: 92px; }

.es-pants { top: 200px; left: 50%; transform: translateX(-50%); width: 92px; }
.es-shoes { top: 270px; left: 50%; transform: translateX(-50%); width: 92px; }
.item-name { color: var(--txt); }
.item-meta { color: #a0b4cc; }
.section-label { color: var(--accent); }

.chrome-shop-list { display: flex; flex-direction: column; gap: 8px; }
.chrome-card {

}
.chrome-card.owned { border-color: #1a4a3a; }
.chrome-card.installed { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,232,255,0.15); }

/* Fixers */
.fixer-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;

}
.fixer-name { font-size: 15px; font-weight: 700; color: var(--magenta); }
.fixer-loc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.fixer-blurb { font-size: 12px; color: #90a0b8; margin: 8px 0; line-height: 1.4; }
.gig-row {
  background: #080c14; border: 1px solid var(--border); border-radius: 8px;

.char-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.char-stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;

};
const WEATHER_TYPES = [
  { id:'clear', name:'Despejado', icon:'☀️', exploreMod:0, lootMod:0 },
  { id:'rain', name:'Lluvia', icon:'🌧', exploreMod:0.05, lootMod:0.05 },

  { id:'storm', name:'Tormenta', icon:'⛈', exploreMod:0.12, lootMod:0.08 },
  { id:'neon', name:'Noche neón', icon:'🌃', exploreMod:0.03, lootMod:0.1 },
];
const DISTRICT_ICON = {
  watson:'⛩', westbrook:'🏯', citycenter:'🏙', heywood:'🚗', pacifica:'🏖', santo:'🏭'
};
let selectedStyle = 'streetkid';
function pickStyle(btn) {
  selectedStyle = btn.dataset.style;
  document.querySelectorAll('.style-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
}

let audioCtx = null, sfxVol = 0.7;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, volMul) {
  if (sfxVol <= 0) return;
  type = type || 'square'; volMul = volMul || 1;
  try {
    ensureAudio();
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(sfxVol * 0.15 * volMul, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { playTone(800, 0.04, 'square', 0.6); }
function sfxTab() { playTone(600, 0.05, 'triangle', 0.5); }
function sfxLoot() { playTone(1200, 0.08, 'sine', 0.7); playTone(1600, 0.1, 'sine', 0.4); }
function sfxHurt() { playTone(120, 0.15, 'sawtooth', 1); }
function sfxHeal() { playTone(500, 0.08, 'sine'); playTone(700, 0.1, 'sine', 0.5); }
function sfxLevel() { playTone(600,0.1,'sine'); setTimeout(function(){playTone(800,0.1,'sine');},80); setTimeout(function(){playTone(1000,0.15,'sine');},160); }
function sfxBuy() { playTone(900, 0.06, 'triangle'); }
function sfxError() { playTone(150, 0.2, 'square', 0.5); }
function sfxWin() { playTone(400,0.08,'sine'); setTimeout(function(){playTone(600,0.1,'sine');},60); setTimeout(function(){playTone(900,0.12,'sine');},140); }
function sfxWeapon(subtype) {
  if (subtype === 'melee') { playTone(220,0.06,'sawtooth',0.9); setTimeout(function(){playTone(180,0.08,'triangle',0.6);},40); }
  else if (subtype === 'smg' || subtype === 'rifle') { playTone(300,0.04,'square',0.7); setTimeout(function(){playTone(280,0.04,'square',0.5);},50); setTimeout(function(){playTone(260,0.05,'square',0.4);},100); }
  else if (subtype === 'shotgun') { playTone(100,0.12,'sawtooth',1); playTone(80,0.15,'square',0.6); }
  else if (subtype === 'tech' || subtype === 'smart') { playTone(900,0.05,'sine',0.8); setTimeout(function(){playTone(700,0.08,'triangle',0.5);},40); }
  else { playTone(350,0.05,'square',0.8); setTimeout(function(){playTone(200,0.06,'triangle',0.4);},30); }
}

function ammoKeyForSubtype(subtype) {
  if (!subtype || subtype === 'melee') return null;
  if (subtype === 'pistol') return 'light';
  if (subtype === 'smg' || subtype === 'rifle') return 'medium';
  if (subtype === 'shotgun') return 'heavy';
  if (subtype === 'tech' || subtype === 'smart') return 'special';
  return 'light';
}
function ammoCostForSubtype(subtype) {
  if (subtype === 'smg') return 2 + Math.floor(Math.random()*3); /* 2-4 */
  if (subtype === 'rifle') return 1 + Math.floor(Math.random()*3); /* 1-3 */
  if (subtype === 'shotgun') return 1 + Math.floor(Math.random()*2); /* 1-2 */
  if (subtype === 'tech' || subtype === 'smart') return 1 + Math.floor(Math.random()*2);
  return 1 + Math.floor(Math.random()*2); /* pistol 1-2 */
}

function itemById(id) { return ITEMS.find(function(i){ return i.id === id; }); }

function invWeight() {
  var w = 0;
  (P.inv||[]).forEach(function(s){
    var d = itemById(s.id); if (d) w += (d.weight||0.1) * (s.qty||1);
  });
  return Math.round(w * 10) / 10;
}
function maxWeight() {
  return 25 + (P.lvl||1) * 2 + Math.floor(getSkillBonus('maxHp')/20) + (P.style==='nomad'?5:0);
}
function isOverweight() { return invWeight() > maxWeight(); }
function priceMod() {
  var mod = 0;
  if (P.style === 'corpo') mod -= 0.05;
  var sc = P.streetCred || 0;
  if (sc >= 50) mod -= 0.15;
  else if (sc >= 30) mod -= 0.10;
  else if (sc >= 15) mod -= 0.05;
  return mod;
}
function itemPrice(def, qty) {
  qty = qty || 1;
  return Math.max(1, Math.floor(def.value * qty * (1 + priceMod())));
}
function addStreetCred(n) {
  P.streetCred = Math.min(100, (P.streetCred||0) + n);
}
function rollWeather(districtId) {
  var pool = WEATHER_TYPES.slice();
  if (districtId === 'pacifica') pool = pool.concat([WEATHER_TYPES[1], WEATHER_TYPES[3]]);
  if (districtId === 'citycenter') pool = pool.concat([WEATHER_TYPES[0], WEATHER_TYPES[4]]);
  if (districtId === 'santo' || districtId === 'watson') pool = pool.concat([WEATHER_TYPES[2]]);
  P.weather = pool[Math.floor(Math.random()*pool.length)];
  return P.weather;
}
function styleBonus(key) {
  var s = RUNNER_STYLES[P.style||'streetkid'];
  return s ? (s[key]||0) : 0;
}


/* Inventory: always merge by id (fixes duplicate equipped display) */
function invQty(id) {
  var total = 0;
  P.inv.forEach(function(x){ if (x.id === id) total += x.qty; });
  return total;
}
function storageQty(id) {
  var total = 0;
  P.storage.forEach(function(x){ if (x.id === id) total += x.qty; });
  return total;
}
function mergeList(list) {
  var map = {};
  list.forEach(function(x){
    if (!map[x.id]) map[x.id] = 0;
    map[x.id] += x.qty;
  });
  return Object.keys(map).map(function(k){ return { id: +k, qty: map[k] }; });
}
function normalizeInv() {
  P.inv = mergeList(P.inv);
  P.storage = mergeList(P.storage);
}
function addItem(id, qty, toStorage) {
  qty = qty || 1; var def = itemById(id); if (!def) return;
  var list = toStorage ? P.storage : P.inv;
  var existing = list.find(function(x){ return x.id === id; });
  if (existing) existing.qty += qty;
  else list.push({ id:id, qty:qty });
}
function removeItem(id, qty, fromStorage) {
  qty = qty || 1;
  var list = fromStorage ? P.storage : P.inv;
  var existing = list.find(function(x){ return x.id === id; });
  if (!existing || existing.qty < qty) return false;
  existing.qty -= qty;
  if (existing.qty <= 0) {
    var idx = list.findIndex(function(x){ return x.id === id; });
    list.splice(idx, 1);
  }
  return true;
}
function availableQty(id) {
  var q = invQty(id);
  var eq = 0;
  if (P.equipped.weapon === id) eq++;
  ['hat','glasses','torso','pants','shoes'].forEach(function(s){ if (P.equipped[s]===id) eq++; });
  if (P.equipped.armor === id && P.equipped.torso !== id) eq++;
  Object.keys(P.equipped.cyberware||{}).forEach(function(s){ if (P.equipped.cyberware[s]===id) eq++; });
  if (P.equipped.hack === id) eq++;
  return Math.max(0, q - eq);
}

function getSkillBonus(key) {
  var total = 0;
  (P.unlockedSkills || []).forEach(function(sid){
    Object.keys(SKILL_TREE).forEach(function(cat){
      SKILL_TREE[cat].nodes.forEach(function(n){
        if (n.id === sid && n.effect && n.effect[key]) total += n.effect[key];
      });
    });
  });
  return total;
}
function getWeaponDmg() {
  var w = itemById(P.equipped.weapon); var dmg = w ? w.dmg : 4;
  Object.keys(P.equipped.cyberware || {}).forEach(function(slot){
    var c = itemById(P.equipped.cyberware[slot]);
    if (c && c.bonusDmg) dmg += c.bonusDmg;
  });
  dmg += getSkillBonus('dmg');
  dmg += styleBonus('dmg');
  return dmg;
}
function getArmorDef() {
  var def = 0;
  ['hat','glasses','torso','pants','shoes'].forEach(function(slot){
    var id = P.equipped[slot];
    var a = id ? itemById(id) : null;
    if (a && a.def) def += a.def;
  });
  /* legacy armor field */
  if (P.equipped.armor && !P.equipped.torso) {
    var leg = itemById(P.equipped.armor);
    if (leg && leg.def) def += leg.def;
  }
  Object.keys(P.equipped.cyberware || {}).forEach(function(slot){
    var c = itemById(P.equipped.cyberware[slot]);
    if (c && c.bonusDef) def += c.bonusDef;
  });
  def += getSkillBonus('def');
  return def;
}
function getCyberHpBonus() {
  var bonus = 0;
  Object.keys(P.equipped.cyberware || {}).forEach(function(slot){
    var c = itemById(P.equipped.cyberware[slot]);
    if (c && c.bonusHp) bonus += c.bonusHp;
  });
  bonus += getSkillBonus('maxHp');
  return bonus;
}
function installedChromeCount() {
  return Object.keys(P.equipped.cyberware || {}).filter(function(k){ return P.equipped.cyberware[k]; }).length;
}
function recalcMaxHp() {
  P.maxHp = 100 + (P.lvl - 1) * 12 + getCyberHpBonus() + styleBonus('maxHp');
  if (P.hp > P.maxHp) P.hp = P.maxHp;
}

function save() {
  try { localStorage.setItem('nightcity_v015', JSON.stringify(P)); return true; } catch(e){ return false; }
}
function load() {
  try {
    var raw = localStorage.getItem('nightcity_v015') || localStorage.getItem('nightcity_v010') || localStorage.getItem('nightcity_v009') || localStorage.getItem('nightcity_v008') || localStorage.getItem('nightcity_v007') || localStorage.getItem('nightcity_v006') || localStorage.getItem('nightcity_v005');
    if (!raw) return false;
    var data = JSON.parse(raw);
    Object.assign(P, data);
    if (!P.storage) P.storage = [];
    if (!P.ownedChrome) P.ownedChrome = [];
    if (!P.completedQuests) P.completedQuests = [];
    if (!P.activeQuests) P.activeQuests = P.quests || [];
    if (!P.unlockedSkills) P.unlockedSkills = [];
    if (P.skillPoints === undefined) P.skillPoints = Math.max(0, P.lvl - 1);
    if (!P.pendingLoot) P.pendingLoot = null;
    if (!P.mapView) P.mapView = 'city';
    if (P.viewDistrict === undefined) P.viewDistrict = null;
    if (P.viewSub === undefined) P.viewSub = null;
    if (!P.day) P.day = 14;
    if (!P.month) P.month = 10;
    if (!P.year) P.year = 2077;
    if (!P.pcMessages) P.pcMessages = [];
    if (!P.pcNews) P.pcNews = [];
    if (P.foodOrder === undefined) P.foodOrder = null;
    if (P.joyOrder === undefined) P.joyOrder = null;
    if (P.streetCred === undefined) P.streetCred = 0;
    if (!P.style) P.style = 'streetkid';
    if (!P.diary) P.diary = [];
    if (P.weather === undefined) P.weather = null;
    if (Array.isArray(P.equipped.cyberware)) {
      var map = {};
      P.equipped.cyberware.forEach(function(cid){
        var c = itemById(cid);
        if (c && c.slot) map[c.slot] = cid;
      });
      P.equipped.cyberware = map;
    }
    if (!P.equipped.cyberware || Array.isArray(P.equipped.cyberware)) P.equipped.cyberware = {};
    /* migrate old slot keys */
    var cw = P.equipped.cyberware;
    if (cw.optics) { cw.eyes = cw.optics; delete cw.optics; }
    if (cw.nervous) { cw.chest = cw.chest || cw.nervous; delete cw.nervous; }
    if (cw.skin) { cw.chest = cw.chest || cw.skin; delete cw.skin; }
    if (cw.circulatory) { cw.chest = cw.chest || cw.circulatory; delete cw.circulatory; }
    if (cw.arms) { cw.hand_l = cw.hand_l || cw.arms; delete cw.arms; }
    if (cw.legs) { cw.leg_l = cw.leg_l || cw.legs; delete cw.legs; }
    if (!P.equipped.hack) P.equipped.hack = null;
    if (P.equipped.armor && !P.equipped.torso) P.equipped.torso = P.equipped.armor;
    ['hat','glasses','pants','shoes'].forEach(function(s){ if (P.equipped[s]===undefined) P.equipped[s]=null; });
    normalizeInv();
    recalcMaxHp();
    return true;
  } catch(e){ return false; }
}

function logMsg(msg, cls) {
  P.log.unshift({ msg:msg, cls:cls||'', t:Date.now() });
  if (P.log.length > 50) P.log.pop();
  renderLog();
}
function renderLog() {
  var el = document.getElementById('log'); if (!el) return;
  el.innerHTML = P.log.slice(0,6).map(function(l){ return '<div class="'+(l.cls||'')+'">'+l.msg+'</div>'; }).join('');
}
function updateStats() {
  document.getElementById('st-hp').textContent = Math.max(0, Math.floor(P.hp));
  document.getElementById('st-maxhp').textContent = P.maxHp;
  document.getElementById('st-lvl').textContent = P.lvl;
  document.getElementById('st-xp').textContent = P.xp;
  document.getElementById('st-maxxp').textContent = P.maxXp;
  document.getElementById('st-eddies').textContent = P.eddies;
  document.getElementById('st-armor').textContent = getArmorDef();
  document.getElementById('st-dmg').textContent = getWeaponDmg();
  var spEl = document.getElementById('st-sp');
  if (spEl) spEl.textContent = P.skillPoints || 0;
  document.getElementById('hp-bar').style.width = Math.min(100, (P.hp / Math.max(1,P.maxHp)) * 100) + '%';
  document.getElementById('xp-bar').style.width = Math.min(100, (P.xp / Math.max(1,P.maxXp)) * 100) + '%';
  var timeStr = String(P.hours).padStart(2,'0')+':'+String(P.minutes).padStart(2,'0');
  document.getElementById('st-time').textContent = formatDate()+' · '+timeStr;
  updateHudLoc();
  updateHudAmmo();
  updateHudExtra();
}
function updateHudLoc() {
  var el = document.getElementById('hud-loc'); if (!el) return;
  var dist = DISTRICTS.find(function(d){ return d.id === (P.viewDistrict || P.district); });
  if (!dist) { el.innerHTML = 'Night City'; return; }
  var sub = dist.subs && P.viewSub ? dist.subs.find(function(s){ return s.id === P.viewSub; }) : null;
  if (sub) el.innerHTML = '<b>'+dist.name+'</b> › '+sub.name+' · <span class="faction">'+sub.faction+'</span>';
  else if (P.mapView === 'district' || P.viewDistrict) el.innerHTML = '<b>'+dist.name+'</b>';
  else el.innerHTML = '<b>Night City</b>';
}
function updateHudAmmo() {
  var el = document.getElementById('hud-ammo'); if (!el) return;
  var w = itemById(P.equipped.weapon);
  var subtype = w ? (w.subtype || 'pistol') : 'melee';
  var key = ammoKeyForSubtype(subtype);
  if (!key) {
    el.innerHTML = '<span class="ammo-melee">Cuerpo a cuerpo — sin munición</span><span>'+(w?w.name:'Puños')+'</span>';
    return;
  }
  var a = AMMO_TYPES[key];
  var q = invQty(a.id);
  el.innerHTML = '<span class="'+(q<=0?'ammo-empty':'')+'">'+a.name+': <b>'+q+'</b></span><span style="color:var(--muted)">'+(w?w.name:'')+'</span>';
}

function updateHudExtra() {
  var el = document.getElementById('hud-extra'); if (!el) return;
  var gigs = (P.activeQuests||[]).filter(function(q){ return !q.done; }).length;
  var chromeN = Object.keys(P.equipped.cyberware||{}).filter(function(k){ return P.equipped.cyberware[k]; }).length;
  var arm = getArmorDef();
  var parts = [];
  parts.push('<span class="hud-chip">★ Cred <b>'+(P.streetCred||0)+'</b></span>');
  parts.push('<span class="hud-chip">🛡 ARM <b>'+arm+'</b></span>');
  parts.push('<span class="hud-chip">⚙ Chrome <b>'+chromeN+'/7</b></span>');
  if (P.weather) parts.push('<span class="hud-chip">'+P.weather.icon+' '+P.weather.name+'</span>');
  if (gigs > 0) parts.push('<span class="hud-chip ok">📋 Gigs <b>'+gigs+'</b></span>');
  if (isOverweight()) parts.push('<span class="hud-chip warn">Peso</span>');

  if (P.joyOrder) parts.push('<span class="hud-chip ok">♥</span>');
  var w = itemById(P.equipped.weapon);
  var key = ammoKeyForSubtype(w ? w.subtype : 'melee');
  if (key && invQty(AMMO_TYPES[key].id) <= 5) parts.push('<span class="hud-chip warn">Munición baja</span>');
  el.innerHTML = parts.join('');
}
function screenFlash(type) {
  var el = document.getElementById('screen-flash'); if (!el) return;
  el.className = 'screen-flash ' + type;
  el.style.opacity = '1';
  setTimeout(function(){ el.style.opacity = '0'; }, 120);
  setTimeout(function(){ el.className = 'screen-flash'; }, 200);
}
function floatDamage(amount, kind) {
  var el = document.createElement('div');
  el.className = 'float-dmg ' + (kind || 'enemy');
  el.textContent = (kind === 'player' ? '−' : '') + amount;
  el.style.left = (50 + (Math.random()*20-10)) + '%';
  el.style.top = (kind === 'player' ? '58%' : '38%');
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
}

/* Cyberpunk-style eddie transfer animation */
function changeEddies(delta, silent) {
  if (!delta) return;
  P.eddies = Math.max(0, P.eddies + delta);
  if (!silent) showEddieTransfer(delta);
  updateStats();
}
function showEddieTransfer(delta) {
  var el = document.createElement('div');
  el.className = 'eddie-transfer' + (delta < 0 ? ' spend' : '');
  var label = delta > 0 ? 'TRANSFER IN' : 'TRANSFER OUT';
  var sign = delta > 0 ? '+' : '';
  var target = Math.abs(delta);
  el.innerHTML = '<div class="eddie-label">'+label+'</div>'+
    '<div class="eddie-amount">'+sign+'<span class="eddie-num">0</span> €$</div>'+
    '<div class="eddie-bar"><div class="eddie-bar-fill"></div></div>';
  document.body.appendChild(el);
  var numEl = el.querySelector('.eddie-num');
  var steps = Math.min(12, Math.max(6, Math.floor(target / 8)));
  var step = 0;
  function tick() {
    step++;
    var val = Math.round(target * (step / steps));
    numEl.textContent = val;
    try {
      ensureAudio();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = 880 + step * 40;
      g.gain.value = sfxVol * 0.06;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
      o.stop(audioCtx.currentTime + 0.05);
    } catch(e){}
    if (step < steps) setTimeout(tick, 45);
    else numEl.textContent = target;
  }
  tick();
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
}
function addXp(amount) {
  P.xp += amount; logMsg('+'+amount+' XP', 'sys');
  while (P.xp >= P.maxXp) {
    P.xp -= P.maxXp; P.lvl++; P.maxXp = Math.floor(P.maxXp * 1.35);
    P.skillPoints = (P.skillPoints || 0) + 1;
    recalcMaxHp(); P.hp = P.maxHp; sfxLevel();
    logMsg('¡NIVEL '+P.lvl+'! +1 punto de habilidad. Max HP aumentado.', 'quest');
    checkQuests();
  }
  updateStats();
}
function heal(amount) { P.hp = Math.min(P.maxHp, P.hp + amount); updateStats(); }
function daysInMonth(m, y) {
  return [31, (y%4===0?29:28), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m-1];
}
function advanceTime(mins) {
  P.minutes += mins;
  while (P.minutes >= 60) { P.minutes -= 60; P.hours++; }
  while (P.hours >= 24) {
    P.hours -= 24;
    P.day = (P.day || 14) + 1;
    var dim = daysInMonth(P.month || 10, P.year || 2077);
    if (P.day > dim) {
      P.day = 1;
      P.month = (P.month || 10) + 1;
      if (P.month > 12) { P.month = 1; P.year = (P.year || 2077) + 1; }
    }
    maybeDailyNews();
  }
  checkDeliveries();
  updateStats();
}
function totalMinutes() {
  return ((P.year-2077)*525600) + ((P.month||10)-1)*43200 + ((P.day||14)-1)*1440 + (P.hours||0)*60 + (P.minutes||0);
}
function formatDate() {
  var d = P.day || 14, m = P.month || 10, y = P.year || 2077;
  return d + ' ' + (MONTHS_ES[m-1]||'oct') + ' ' + y;
}
function maybeDailyNews() {
  if (!P.pcNews) P.pcNews = [];
  var n = NEWS_POOL[Math.floor(Math.random()*NEWS_POOL.length)];
  P.pcNews.unshift({ title:n.title, body:n.body, date:formatDate() });
  if (P.pcNews.length > 12) P.pcNews.pop();
}
function seedPcIfNeeded() {
  if (!P.pcMessages) P.pcMessages = [];
  if (!P.pcNews) P.pcNews = [];
  if (P.pcNews.length === 0) {
    for (var i=0;i<4;i++) {
      var n = NEWS_POOL[(i*3)%NEWS_POOL.length];
      P.pcNews.push({ title:n.title, body:n.body, date:formatDate() });
    }
  }
  if (P.pcMessages.length === 0) {
    P.pcMessages.push({ from:'Sistema', text:'Bienvenido a tu terminal doméstico. Conexión segura (más o menos).', read:false, date:formatDate() });
    var m = MSG_POOL[Math.floor(Math.random()*MSG_POOL.length)];
    P.pcMessages.push({ from:m.from, text:m.text, read:false, date:formatDate() });
  }
}
function checkDeliveries() {
  var now = totalMinutes();
  if (P.foodOrder && now >= P.foodOrder.readyAt) {
    heal(P.foodOrder.heal);
    logMsg('Pedido llegado: '+P.foodOrder.name+' (+'+P.foodOrder.heal+' HP).', 'loot');
    sfxHeal();
    P.foodOrder = null;
  }
  if (P.joyOrder && now >= P.joyOrder.readyAt) {
    heal(P.joyOrder.heal);
    logMsg('Tu cita con '+P.joyOrder.name+' ha terminado. Te sientes mejor (+'+P.joyOrder.heal+' HP).', 'sys');
    sfxHeal();
    P.joyOrder = null;
  }
}
function orderFood(fid) {
  if (P.foodOrder) { sfxError(); logMsg('Ya tienes comida en camino.', 'sys'); return; }
  var f = FOOD_MENU.find(function(x){ return x.id===fid; }); if (!f) return;
  if (P.eddies < f.cost) { sfxError(); logMsg('Sin eddies para pedir.', 'sys'); return; }
  changeEddies(-f.cost);
  P.foodOrder = { name:f.name, heal:f.heal, readyAt: totalMinutes() + f.wait };
  sfxBuy(); logMsg('Pedido: '+f.name+'. Llegará en ~'+f.wait+' min.', 'sys');
  save(); render();
}
function orderJoytoy(jid) {
  if (P.joyOrder) { sfxError(); logMsg('Ya tienes una cita pendiente.', 'sys'); return; }
  var j = JOYTOY_MENU.find(function(x){ return x.id===jid; }); if (!j) return;
  if (P.eddies < j.cost) { sfxError(); logMsg('Sin eddies para el servicio.', 'sys'); return; }
  changeEddies(-j.cost);
  P.joyOrder = { name:j.name, heal:j.heal, readyAt: totalMinutes() + j.wait };
  sfxBuy(); logMsg('Cita reservada: '+j.name+'. Espera ~'+j.wait+' min.', 'sys');
  save(); render();
}
function doPcBiz(bid) {
  var b = PC_BIZ.find(function(x){ return x.id===bid; }); if (!b) return;
  if (P.eddies < b.cost) { sfxError(); logMsg('Sin eddies.', 'sys'); return; }
  changeEddies(-b.cost);
  if (b.item) {
    addItem(b.item, 1); sfxLoot(); logMsg('Data shard recibido.', 'loot');
  } else if (b.msg) {
    var m = MSG_POOL[Math.floor(Math.random()*MSG_POOL.length)];
    if (!P.pcMessages) P.pcMessages = [];
    P.pcMessages.unshift({ from:m.from, text:m.text, read:false, date:formatDate() });
    sfxBuy(); logMsg('Nuevo mensaje en tu bandeja.', 'sys');
  } else {
    var gain = b.min + Math.floor(Math.random()*(b.max-b.min+1));
    changeEddies(gain);
    logMsg('Inversión cerrada: '+(gain>=b.cost?'+':'')+(gain-b.cost)+' €$ netos.', gain>=b.cost?'loot':'sys');
  }
  advanceTime(15); save(); render();
}
function refreshNews() {
  maybeDailyNews(); sfxClick(); save(); render();
}
function markMessagesRead() {
  if (!P.pcMessages) return;
  P.pcMessages.forEach(function(m){ m.read = true; });
  save(); render();
}

/* ===== QUESTS / FIXERS ===== */
function getQuestDef(id) { return QUESTS_POOL.find(function(q){ return q.id === id; }); }
function isQuestActive(id) { return P.activeQuests.some(function(q){ return q.id === id && !q.done; }); }
function isQuestCompleted(id) { return P.completedQuests.indexOf(id) >= 0 || P.activeQuests.some(function(q){ return q.id === id && q.done; }); }
function acceptQuest(qid) {
  if (isQuestActive(qid) || isQuestCompleted(qid)) { sfxError(); logMsg('Ese gig ya no está disponible.', 'sys'); return; }
  var def = getQuestDef(qid); if (!def) return;
  var activeCount = P.activeQuests.filter(function(q){ return !q.done; }).length;
  if (activeCount >= 4) { sfxError(); logMsg('Máximo 4 gigs activos. Completa alguno primero.', 'sys'); return; }
  P.activeQuests.push(Object.assign({}, def, { progress:0, done:false }));
  sfxClick(); logMsg('Gig aceptado: '+def.title, 'quest'); save(); render();
}
function checkQuests() {
  P.activeQuests.forEach(function(q){
    if (q.done) return;
    if (q.type === 'level' && P.lvl >= q.target) { q.progress = q.target; completeQuest(q); }
  });
}
function onKill(enemy) {
  var g = enemy.gang || 'other';
  P.kills[g] = (P.kills[g]||0) + 1;
  P.activeQuests.forEach(function(q){
    if (q.done) return;
    if (q.type === 'kill' && q.gang === g) {
      q.progress = Math.min(q.target, (q.progress||0)+1);
      if (q.progress >= q.target) completeQuest(q);
    }
    if (q.type === 'kill_legend' && enemy.legendary) {
      q.progress = Math.min(q.target, (q.progress||0)+1);
      if (q.progress >= q.target) completeQuest(q);
    }
  });
}
function completeQuest(q) {
  if (!P.diary) P.diary = [];
  P.diary.unshift({ title:q.title, date:formatDate(), eddies:(q.reward&&q.reward.eddies)||0, xp:(q.reward&&q.reward.xp)||0 });
  if (P.diary.length > 30) P.diary.pop();
  addStreetCred(3);

  if (q.done) return; q.done = true;
  if (P.completedQuests.indexOf(q.id) < 0) P.completedQuests.push(q.id);
  var r = q.reward;
  if (r.eddies) { changeEddies(r.eddies); logMsg('+'+r.eddies+' €$', 'loot'); }
  if (r.xp) addXp(r.xp);
  if (r.item) { addItem(r.item, r.qty||1); logMsg('Obtenido: '+itemById(r.item).name, 'loot'); }
  sfxWin(); logMsg('GIG COMPLETADO: '+q.title, 'quest'); save();
}

/* ===== COMBAT ===== */
function startCombat(enemyTemplate) {
  var e = Object.assign({}, enemyTemplate);
  e.hp = e.hp + Math.floor(Math.random()*8); e.maxHp = e.hp; e.droppedLoot = [];
  if (e.loot && e.loot.length) {
    var numDrops = 1 + (Math.random() < 0.35 ? 1 : 0);
    var shuffled = e.loot.slice().sort(function(){ return Math.random()-0.5; });
    for (var i=0; i<Math.min(numDrops, shuffled.length); i++) {
      if (Math.random() < 0.75) e.droppedLoot.push(shuffled[i]);
    }
  }
  P.combat = { enemy:e, turn:'player' };
  logMsg('¡Combate! '+e.name+' aparece.', 'combat'); render();
}
function combatAttack() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var e = P.combat.enemy, w = itemById(P.equipped.weapon);
  var subtype = w ? (w.subtype || 'pistol') : 'melee';
  var ammoKey = ammoKeyForSubtype(subtype);
  if (ammoKey) {
    var ammoId = AMMO_TYPES[ammoKey].id;
    var cost = ammoCostForSubtype(subtype);
    if (invQty(ammoId) < cost) {
      sfxError();
      logMsg('Sin munición ('+AMMO_TYPES[ammoKey].name+'). Usa melee o recarga.', 'combat');
      return;
    }
    removeItem(ammoId, cost);
    logMsg('−'+cost+' '+AMMO_TYPES[ammoKey].name, 'sys');
  }
  sfxWeapon(subtype);
  var base = getWeaponDmg() + Math.floor(Math.random()*5) - 1;
  if (isOverweight()) base = Math.max(1, base - 2);
  var crit = Math.random() < 0.12;
  var dmg = Math.max(1, crit ? Math.floor(base * 1.6) : base);
  e.hp -= dmg;
  floatDamage(dmg, crit ? 'crit' : 'enemy');
  if (crit) screenFlash('crit');
  logMsg('Atacas a '+e.name+' con '+(w?w.name:'puños')+' por '+dmg+(crit?' ¡CRÍTICO!':'')+'.', 'combat');
  if (e.hp <= 0) { endCombat(true); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}
function combatHeal() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var meds = [60,59,55,52,51,53,50,58,54], used = false;
  for (var i=0;i<meds.length;i++) {
    if (invQty(meds[i]) > 0) {
      var it = itemById(meds[i]); removeItem(meds[i],1); heal(it.heal); sfxHeal();
      logMsg('Usas '+it.name+' (+'+it.heal+' HP).', 'sys'); used = true; break;
    }
  }
  if (!used) { sfxError(); logMsg('No tienes estimulantes.', 'sys'); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}
function combatFlee() {
  if (!P.combat) return;
  var chance = 0.55 + getSkillBonus('fleeBonus');
  if (Math.random() < chance) { logMsg('Escapas por los callejones.', 'sys'); sfxClick(); P.combat = null; advanceTime(5); render(); }
  else { logMsg('¡No puedes escapar!', 'combat'); sfxError(); P.combat.turn = 'enemy'; setTimeout(enemyTurn, 400); render(); }
}
function combatHack() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var deck = (P.equipped.cyberware||{}).chip;
  if (!deck) { sfxError(); logMsg('Necesitas un cyberdeck en el slot Chip.', 'combat'); return; }
  var h = itemById(P.equipped.hack);
  if (!h || h.type !== 'quickhack') { sfxError(); logMsg('No tienes un quickhack equipado.', 'combat'); return; }
  var e = P.combat.enemy;
  var dmg = (h.hackDmg||10) + getSkillBonus('hackDmg') + styleBonus('hackDmg') + Math.floor(Math.random()*4);
  var deckBonus = itemById(deck);
  if (deckBonus && deckBonus.bonusDmg) dmg += deckBonus.bonusDmg;
  e.hp -= dmg;
  sfxWeapon('tech');
  floatDamage(dmg, 'crit');
  screenFlash('crit');
  logMsg('Hack «'+h.name+'» → '+e.name+' por '+dmg+'.', 'combat');
  if (h.skipEnemy) {
    logMsg(e.name+' queda atontado este turno.', 'sys');
    if (e.hp <= 0) { endCombat(true); return; }
    P.combat.turn = 'player';
    save(); render();
    return;
  }
  if (e.hp <= 0) { endCombat(true); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}

function enemyTurn() {
  if (!P.combat) return;
  var e = P.combat.enemy, raw = e.dmg + Math.floor(Math.random()*4);
  var dmg = Math.max(1, raw - Math.floor(getArmorDef()*0.6));
  P.hp -= dmg; sfxHurt(); screenFlash('hurt'); floatDamage(dmg, 'player');
  logMsg(e.name+' te golpea por '+dmg+'.', 'combat');
  if (P.hp <= 0) {
    P.hp = 0; logMsg('Has caído... Un fixer te arrastra al ripperdoc. Pierdes eddies.', 'combat');
    var loss = Math.floor(P.eddies*0.15);
    if (loss > 0) changeEddies(-loss);
    P.hp = Math.floor(P.maxHp*0.4); P.combat = null; advanceTime(60); save(); render(); return;
  }
  P.combat.turn = 'player'; updateStats(); render();
}
function endCombat(won) {
  var e = P.combat.enemy; P.combat = null;
  if (won) {
    sfxWin(); screenFlash('loot'); logMsg('Has derrotado a '+e.name+'.', 'combat');
    var gain = e.eddies[0] + Math.floor(Math.random()*(e.eddies[1]-e.eddies[0]+1));
    var eddiesPct = getSkillBonus('eddiesPct') + styleBonus('eddiesPct');
    gain = Math.floor(gain * (1 + eddiesPct));
    addXp(12 + e.level*4);
    onKill(e); addStreetCred(e.legendary?2:1); advanceTime(8);
    /* Build loot menu — player chooses what to take */
    var lootItems = (e.droppedLoot || []).slice();
    P.pendingLoot = { eddies: gain, items: lootItems, enemyName: e.name };
    save();
    render();
    openLootModal();
    return;
  }
  save(); render();
}

function openLootModal() {
  if (!P.pendingLoot) return;

function takeLootItem(idx) {
  if (!P.pendingLoot || !P.pendingLoot.items[idx]) return;
  var lid = P.pendingLoot.items[idx];
  var def = itemById(lid);
  addItem(lid, 1);

    P.activeQuests.forEach(function(q){

        q.progress = (q.progress||0)+1;
        if (q.progress >= q.target) completeQuest(q);
      }
    });
  }
  P.pendingLoot.items.splice(idx, 1);

  openLootModal();
}
function takeAllLoot() {

    changeEddies(P.pendingLoot.eddies);
    logMsg('+'+P.pendingLoot.eddies+' €$', 'loot');

}
function closeLootModal() {

/* ===== WORLD ===== */
function explore() {
  if (P.combat) return; sfxClick();
  advanceTime(12 + Math.floor(Math.random()*18));
  var dist = DISTRICTS.find(function(d){ return d.id === (P.viewDistrict||P.district); });
  var sub = dist && dist.subs && P.viewSub ? dist.subs.find(function(s){ return s.id === P.viewSub; }) : null;
  var danger = sub ? sub.danger : (dist ? dist.danger : 2);
  var faction = sub ? sub.faction : null;
  var wx = P.weather || WEATHER_TYPES[0];
  var roll = Math.random(), dangerMod = (danger||2)*0.07 + (wx.exploreMod||0);
  if (roll < 0.38 + dangerMod) {
    var maxLvl = Math.min(P.lvl+3, 15);
    var pool = ENEMIES.filter(function(e){
      var lvlOk = e.level <= maxLvl && e.level >= Math.max(1, P.lvl-3);
      if (faction && Math.random() < 0.65) return lvlOk && e.gang === faction;
      return lvlOk;
    });
    if (!pool.length) pool = ENEMIES.filter(function(e){ return e.level <= maxLvl; });
    var enemy = pool[Math.floor(Math.random()*pool.length)] || ENEMIES[0];
    if ((danger >= 5 && Math.random() < 0.14) || Math.random() < 0.06)
      enemy = ENEMIES.find(function(e){ return e.legendary; }) || enemy;
    startCombat(enemy);
  } else if (roll < 0.52 + (wx.lootMod||0)*0.5) {
    var gain = 12 + Math.floor(Math.random()*45) + danger*6;
    changeEddies(gain); sfxLoot(); logMsg('Encuentras '+gain+' €$.', 'loot'); save(); render();
  } else if (roll < 0.68 + (wx.lootMod||0)*0.4) {
    var pool = ITEMS.filter(function(i){ return (i.rarity==='common'||i.rarity==='uncommon') && (i.type==='consumable'||i.type==='weapon'||i.type==='armor'||i.type==='ammo'); });
    var it = pool[Math.floor(Math.random()*pool.length)];
    addItem(it.id, it.type==='ammo' ? 10+Math.floor(Math.random()*15) : 1); sfxLoot(); logMsg('Encuentras: '+it.name, 'loot'); save(); render();
  } else if (roll < 0.78) { logMsg('Calles vacías... solo neones y un drone lejano.', 'sys'); render(); }
  else if (roll < 0.88) {
    if (P.eddies >= 40) { changeEddies(-40); addItem(50,1); logMsg('Compras un MaxDoc Mk.1 por 40 €$.', 'loot'); sfxBuy(); }
    else logMsg('Un vendedor te ofrece algo, pero no te llega el dinero.', 'sys');
    save(); render();
  } else if (roll < 0.94) { logMsg('Oyes disparos a lo lejos.', 'sys'); render(); }
  else {
    var cheapChrome = [113,112,100,105], cid = cheapChrome[Math.floor(Math.random()*cheapChrome.length)];
    if (!P.ownedChrome.includes(cid) && invQty(cid)===0) { addItem(cid,1); sfxLoot(); logMsg('¡Chrome abandonado: '+itemById(cid).name+'!', 'loot'); }
    else { var g2 = 30+Math.floor(Math.random()*50); changeEddies(g2); logMsg('Encuentras '+g2+' €$.', 'loot'); }
    save(); render();
  }
  updateStats();
}

/* ===== EQUIP / CHROME ===== */
function equipItem(id) {
  var def = itemById(id); if (!def) return;
  if (invQty(id) <= 0) { sfxError(); return; }
  sfxClick();
  if (def.type === 'weapon') P.equipped.weapon = id;
  else if (def.type === 'armor') {
    var slot = def.clothSlot || 'torso';
    P.equipped[slot] = id;
    if (slot === 'torso') P.equipped.armor = id; /* legacy */
  }
  save(); render();
}
function unequipCloth(slot) {
  P.equipped[slot] = null;
  if (slot === 'torso') P.equipped.armor = null;
  sfxClick(); save(); render();
}
function unequipWeapon() {
  P.equipped.weapon = null; sfxClick(); save(); render();
}
function unequipArmor() {
  P.equipped.armor = null; sfxClick(); save(); render();
}
function useItem(id) {
  var def = itemById(id); if (!def || def.type !== 'consumable' || invQty(id)<=0) return;
  removeItem(id,1); heal(def.heal||0); sfxHeal(); logMsg('Usas '+def.name+' (+'+def.heal+' HP).', 'sys'); save(); render();
}
function ownsChrome(id) {
  return P.ownedChrome.indexOf(id) >= 0 || invQty(id) > 0;
}
function installChrome(id, forceSlot) {
  var def = itemById(id); if (!def || (def.type !== 'cyberware' && def.type !== 'quickhack')) return;
  if (!ownsChrome(id) && invQty(id) <= 0) { sfxError(); logMsg('No posees ese chrome.', 'sys'); return; }
  if (!P.equipped.cyberware) P.equipped.cyberware = {};
  if (invQty(id) > 0 && (P.ownedChrome||[]).indexOf(id) < 0) {
    removeItem(id,1); P.ownedChrome.push(id);
  }
  var slot = forceSlot || def.slot;
  /* map generic hand/leg to a free side if needed */
  if (slot === 'hand') {
    if (!P.equipped.cyberware.hand_l) slot = 'hand_l';
    else if (!P.equipped.cyberware.hand_r) slot = 'hand_r';
    else slot = 'hand_l';
  }
  if (slot === 'leg') {
    if (!P.equipped.cyberware.leg_l) slot = 'leg_l';
    else if (!P.equipped.cyberware.leg_r) slot = 'leg_r';
    else slot = 'leg_l';
  }
  if (def.type === 'quickhack') {
    P.equipped.hack = id;
    if (!(P.ownedChrome||[]).includes(id) && invQty(id)>0) { removeItem(id,1); P.ownedChrome.push(id); }
    sfxBuy(); logMsg('Hack equipado: '+def.name, 'sys');
  } else {
    P.equipped.cyberware[slot] = id;
    recalcMaxHp(); sfxBuy(); logMsg('Instalado en '+(SLOT_LABEL[slot]||slot)+': '+def.name, 'sys');
  }
  document.getElementById('modal-slot').classList.add('hidden');
  save(); render();
}
function uninstallChromeSlot(slot) {
  if (!P.equipped.cyberware || !P.equipped.cyberware[slot]) return;
  var id = P.equipped.cyberware[slot];
  delete P.equipped.cyberware[slot];
  if (P.ownedChrome.indexOf(id) < 0) P.ownedChrome.push(id);
  recalcMaxHp(); sfxClick(); logMsg('Chrome desinstalado.', 'sys');
  document.getElementById('modal-slot').classList.add('hidden');
  save(); render();
}
function buyChrome(id) {
  var def = itemById(id); if (!def) return;
  if (ownsChrome(id)) { sfxError(); logMsg('Ya posees ese chrome.', 'sys'); return; }
  if (P.eddies < def.value) { sfxError(); logMsg('No tienes suficientes eddies.', 'sys'); return; }
  changeEddies(-def.value); P.ownedChrome.push(id); sfxBuy();
  logMsg('Chrome adquirido: '+def.name+' (−'+def.value+' €$)', 'loot'); save(); render();
}
function openSlotModal(slot) {
  sfxClick();
  var body = document.getElementById('modal-slot-body');
  var slotInfo = CHROME_SLOTS.find(function(s){ return s.id === slot; });
  var accept = slotInfo ? slotInfo.accept : [slot];
  var equippedId = (P.equipped.cyberware || {})[slot];
  var eq = equippedId ? itemById(equippedId) : null;
  var html = '<h3>'+(slotInfo?slotInfo.name:slot)+'</h3>';
  if (eq) {
    html += '<div class="item-card" style="margin:10px 0"><div class="item-name '+rarityClass(eq.rarity)+'">'+eq.name+'</div>'+
      '<div class="item-meta">'+(eq.ability||eq.desc)+'</div>'+
      '<div class="item-actions"><button class="danger" onclick="uninstallChromeSlot(\''+slot+'\')">Desinstalar</button></div></div>';
  } else {
    html += '<p style="font-size:12px;color:var(--muted)">Slot vacío. Elige chrome que poseas.</p>';
  }
  /* owned items matching accept slots */
  var owned = [];
  (P.ownedChrome||[]).forEach(function(id){
    var c = itemById(id);
    if (c && accept.indexOf(c.slot) >= 0) owned.push(c);
  });
  P.inv.forEach(function(s){
    var c = itemById(s.id);
    if (c && (c.type==='cyberware'||c.type==='quickhack') && accept.indexOf(c.slot) >= 0) {
      if (!owned.some(function(o){ return o.id===c.id; })) owned.push(c);
    }
  });
  /* for chip: also show quickhacks as equippable combat programs */
  if (slot === 'chip') {
    P.inv.forEach(function(s){
      var c = itemById(s.id);
      if (c && c.type==='quickhack' && !owned.some(function(o){ return o.id===c.id; })) owned.push(c);
    });
  }
  html += '<div class="section-label">Disponible</div>';
  if (!owned.length) html += '<div class="empty-state">No tienes chrome para este slot. Búscalo en el mercado o en las calles.</div>';
  owned.forEach(function(c){
    var isOn = equippedId === c.id;
    html += '<div class="item-card"><div class="item-card-top"><div>'+
      '<div class="item-name '+rarityClass(c.rarity)+'">'+c.name+'</div>'+
      '<div class="item-meta">'+(c.ability||c.desc)+'</div></div></div>'+
      '<div class="item-actions">'+
      (isOn?'<span class="equipped-tag">INSTALADO</span>':'<button onclick="installChrome('+c.id+',\''+slot+'\')">Instalar</button>')+
      '</div></div>';
  });
  html += '<button class="ghost" style="width:100%;margin-top:8px" onclick="document.getElementById(\'modal-slot\').classList.add(\'hidden\')">Cerrar</button>';
  body.innerHTML = html;
  document.getElementById('modal-slot').classList.remove('hidden');
}

function sellItem(id, fromStorage) {
  var def = itemById(id); if (!def) return;
  var qty = fromStorage ? storageQty(id) : invQty(id);
  if (qty <= 0) return;
  if (!fromStorage) {
    if ((P.equipped.weapon === id || P.equipped.armor === id || P.equipped.hat===id || P.equipped.glasses===id || P.equipped.torso===id || P.equipped.pants===id || P.equipped.shoes===id) && qty <= 1) {

function moveToStorage(id) {

function moveFromStorage(id) {

/* ===== CRAFT / DISASSEMBLE ===== */
function disassembleItem(id) {
  var def = itemById(id);
  if (!def || (def.type !== 'weapon' && def.type !== 'armor')) {
    sfxError(); logMsg('Solo puedes desguazar armas y atuendos.', 'sys'); return;
  }
  if (P.equipped.weapon === id || P.equipped.armor === id) {
    if (availableQty(id) <= 0) { sfxError(); logMsg('Desequipa antes de desguazar tu única unidad.', 'sys'); return; }
  }
  if (invQty(id) <= 0) return;
  var compId = RARITY_COMPONENT[def.rarity] || RARITY_COMPONENT.common;
  var qty = 1 + getSkillBonus('scrapBonus');
  removeItem(id, 1);
  addItem(compId, qty);
  sfxBuy();
  logMsg('Desguazado: '+def.name+' → '+qty+'× '+itemById(compId).name, 'loot');
  save(); render();
}
function canCraft(recipe) {
  var discount = getSkillBonus('craftDiscount') || 0;
  var isAmmo = recipe.result >= 210 && recipe.result <= 213;
  var ok = true;
  Object.keys(recipe.cost).forEach(function(cid){
    var need = isAmmo ? recipe.cost[cid] : Math.max(1, recipe.cost[cid] - discount);
    if (invQty(+cid) < need) ok = false;
  });
  return ok;
}
function craftRecipe(rid) {
  var recipe = CRAFT_RECIPES.find(function(r){ return r.id === rid; });
  if (!recipe) return;
  if (!canCraft(recipe)) { sfxError(); logMsg('Te faltan componentes.', 'sys'); return; }
  var discount = getSkillBonus('craftDiscount') || 0;
  Object.keys(recipe.cost).forEach(function(cid){
    var need = Math.max(1, recipe.cost[cid] - (recipe.result >= 210 && recipe.result <= 213 ? 0 : discount));
    if (recipe.result >= 210 && recipe.result <= 213) need = recipe.cost[cid];
    removeItem(+cid, need);
  });
  var qty = recipe.qty || 1;
  addItem(recipe.result, qty);
  sfxWin();
  logMsg('Fabricado: '+itemById(recipe.result).name+(qty>1?' ×'+qty:''), 'loot');
  save(); render();
}

/* ===== SKILLS ===== */
function isSkillUnlocked(id) { return (P.unlockedSkills || []).indexOf(id) >= 0; }
function canUnlockSkill(node) {
  if (isSkillUnlocked(node.id)) return false;
  if ((P.skillPoints || 0) < node.cost) return false;
  if (node.req && !isSkillUnlocked(node.req)) return false;
  return true;
}
function unlockSkill(sid) {
  var node = null;
  Object.keys(SKILL_TREE).forEach(function(cat){
    SKILL_TREE[cat].nodes.forEach(function(n){ if (n.id === sid) node = n; });
  });
  if (!node || !canUnlockSkill(node)) { sfxError(); return; }
  P.skillPoints -= node.cost;
  P.unlockedSkills.push(sid);
  recalcMaxHp();
  sfxLevel();
  logMsg('Habilidad desbloqueada: '+node.name, 'quest');
  save(); render();
}

function rarityClass(r) { return 'rarity-'+(r||'common'); }

/* ===== RENDER ===== */
function render() {
  updateStats(); renderLog();
  var main = document.getElementById('main');
  main.classList.add('fading');
  setTimeout(function(){
    if (P.combat) { renderCombat(main); }
    else if (currentTab==='map') renderMap(main);
    else if (currentTab==='inv') renderInv(main);
    else if (currentTab==='chrome') renderChrome(main);
    else if (currentTab==='fixers') renderFixers(main);
    else if (currentTab==='craft') renderCraft(main);
    else if (currentTab==='skills') renderSkills(main);
    else if (currentTab==='shop') renderShop(main);
    else if (currentTab==='apt') renderApt(main);
    main.classList.remove('fading');
  }, 80);
}

function renderCombat(main) {
  var e = P.combat.enemy, w = itemById(P.equipped.weapon);
  var ePct = Math.max(0,(e.hp/e.maxHp)*100), pPct = Math.max(0,(P.hp/P.maxHp)*100);

  var ammoKey = ammoKeyForSubtype(subtype);
  var ammoHtml = '<div class="ammo-row">';
  ['light','medium','heavy','special'].forEach(function(k){
    var a = AMMO_TYPES[k]; var q = invQty(a.id);
    var active = ammoKey === k;
    ammoHtml += '<span class="ammo-chip'+(q<=0?' empty':'')+'" style="'+(active?'border-color:var(--gold);color:var(--gold)':'')+'">'+
      a.name.replace('Munición ','')+': '+q+(active?' ◈':'')+'</span>';
  });
  ammoHtml += '</div>';
  if (!ammoKey) ammoHtml += '<div style="font-size:11px;color:var(--green);margin-bottom:6px">Cuerpo a cuerpo — no gasta munición</div>';
  main.innerHTML = '<div class="combat-screen"><div class="combat-title">⚔ COMBATE</div>'+
    '<div class="combat-entity enemy"><div class="combat-name enemy">'+e.name+'</div>'+
    '<div style="font-size:11px;color:var(--muted)">'+(e.gang||'')+' · Nv '+e.level+'</div>'+
    '<div class="combat-hp-bar"><div class="combat-hp-fill enemy" style="width:'+ePct+'%"></div></div>'+
    '<div style="font-size:12px;margin-top:4px">'+Math.max(0,Math.floor(e.hp))+' / '+e.maxHp+'</div></div>'+
    '<div class="combat-entity player"><div class="combat-name player">'+P.name+'</div>'+
    '<div style="font-size:11px;color:var(--muted)">'+(w?w.name:'Puños')+' · ARM '+getArmorDef()+' · DMG '+getWeaponDmg()+'</div>'+
    '<div class="combat-hp-bar"><div class="combat-hp-fill player" style="width:'+pPct+'%"></div></div>'+
    '<div style="font-size:12px;margin-top:4px">'+Math.floor(P.hp)+' / '+P.maxHp+'</div></div>'+
    ammoHtml+

    '<button class="danger" onclick="combatFlee()" '+(P.combat.turn!=='player'?'disabled':'')+'>HUIR</button>'+

document.addEventListener('keydown', function(ev){
  if (!P.combat || P.combat.turn !== 'player') return;
  if (ev.target && (ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA')) return;
  var k = ev.key;
  if (k==='1') { ev.preventDefault(); combatAttack(); }
  else if (k==='2') { ev.preventDefault(); combatHeal(); }
  else if (k==='3') { ev.preventDefault(); combatHack(); }
  else if (k==='4') { ev.preventDefault(); combatFlee(); }
});

    '<div class="wb-track"><div class="wb-fill" style="width:'+Math.min(100,invWeight()/maxWeight()*100)+'%"></div></div></div>';
  html += '<div class="subtabs">'+filters.map(function(f){
    return '<button class="'+(_invFilter===f.id?'active':'')+'" onclick=\"_invFilter=\''+f.id+'\';render()\">'+f.label+'</button>';
  }).join('')+'</div><div class="item-list">';

  normalizeInv();
  var items = P.inv.map(function(slot){ return {id:slot.id, qty:slot.qty, def:itemById(slot.id)}; }).filter(function(x){ return x.def; });
  var filtered = _invFilter==='all' ? items : items.filter(function(x){ return x.def.type===_invFilter; });

  if (!filtered.length) html += '<div class="empty-state">Mochila vacía en esta categoría.</div>';
  else filtered.forEach(function(slot){
    var id=slot.id, qty=slot.qty, def=slot.def;
    var isEqW = P.equipped.weapon === id;
    var clothSlot = def.clothSlot;
    var isEqA = clothSlot && P.equipped[clothSlot] === id;
    var isEqC = Object.keys(P.equipped.cyberware||{}).some(function(s){ return P.equipped.cyberware[s]===id; });
    var isEqH = P.equipped.hack === id;
    var isEq = isEqW || isEqA || isEqC || isEqH;
    var eqTag = isEq ? '<span class="equipped-tag">EQUIPADO</span>' : '';
    var chips = '';
    if (def.type==='weapon') chips = '<span class="stat-chip">DMG '+def.dmg+'</span><span class="stat-chip">'+def.subtype+'</span>';
    else if (def.type==='armor') chips = '<span class="stat-chip">DEF '+(def.def||0)+'</span><span class="stat-chip">'+(def.clothSlot||'torso')+'</span>';
    else if (def.type==='consumable') chips = '<span class="stat-chip">+'+def.heal+' HP</span>';
    else if (def.type==='cyberware'||def.type==='quickhack') chips = '<span class="stat-chip">'+(def.ability||def.slot)+'</span>';
    else if (def.type==='component') chips = '<span class="stat-chip">Desguace</span>';
    else if (def.type==='ammo') chips = '<span class="stat-chip">Munición</span>';
    chips += '<span class="stat-chip">'+def.value+' €$</span>';
    var actions = '';
    if (def.type==='weapon') {
      actions = isEqW ? '<button class="ghost" onclick="unequipWeapon()">Desequipar</button>' : '<button onclick="equipItem('+id+')">Equipar</button>';
      actions += '<button class="danger" onclick="disassembleItem('+id+')">Desguazar</button>';
    } else if (def.type==='armor') {
      actions = isEqA ? '<button class="ghost" onclick="unequipCloth(\''+(clothSlot||'torso')+'\')">Desequipar</button>' : '<button onclick="equipItem('+id+')">Equipar</button>';
      actions += '<button class="danger" onclick="disassembleItem('+id+')">Desguazar</button>';
    } else if (def.type==='cyberware') {
      actions = '<button onclick="installChrome('+id+')">Instalar</button>';
    } else if (def.type==='quickhack') {
      actions = isEqH ? '<button class="ghost" onclick="P.equipped.hack=null;save();render()">Quitar</button>' : '<button class="magenta" onclick="installChrome('+id+',\'chip\')">Equipar hack</button>';
    } else if (def.type==='consumable') {
      actions = '<button class="green" onclick="useItem('+id+')">Usar</button>';
    }
    if (def.type !== 'component' && def.type !== 'ammo') {
      actions += '<button class="gold" onclick="sellItem('+id+')">Vender</button>';
      actions += '<button class="ghost" onclick="moveToStorage('+id+')">Almacén</button>';
    } else {
      actions += '<button class="gold" onclick="sellItem('+id+')">Vender</button>';
    }
    html += '<div class="item-card"><div class="item-card-top"><div>'+
      '<div class="item-name '+rarityClass(def.rarity)+'">'+def.name+(qty>1?' ×'+qty:'')+' '+eqTag+'</div>'+
      '<div class="item-meta">'+def.desc+'</div>'+
      '<div class="item-stats-row">'+chips+'</div></div></div>'+
      '<div class="item-actions">'+actions+'</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
}

function openEquipModal(kind) {
  sfxClick();
  var body = document.getElementById('modal-slot-body');
  var labels = { weapon:'Arma', hat:'Gorra', glasses:'Gafas', torso:'Torso', pants:'Pantalón', shoes:'Calzado' };
  var html = '<h3>'+(labels[kind]||kind)+'</h3>';
  var curDmg = getWeaponDmg(), curArm = getArmorDef();
  var list = P.inv.map(function(s){ return itemById(s.id); }).filter(function(d){
    if (!d) return false;
    if (kind==='weapon') return d.type==='weapon';
    return d.type==='armor' && (d.clothSlot||'torso') === kind;
  });
  if (!list.length) html += '<div class="empty-state">No tienes nada para esta ranura en la mochila.</div>';
  list.forEach(function(def){
    var eq = kind==='weapon' ? P.equipped.weapon===def.id : P.equipped[kind]===def.id;
    html += '<div class="item-card"><div class="item-name '+rarityClass(def.rarity)+'">'+def.name+'</div>'+
      '<div class="item-meta">'+def.desc+(def.def!=null?' · DEF '+def.def:'')+(def.dmg!=null?' · DMG '+def.dmg:'')+'</div>';
    if (!eq) {
      var cmp = '';
      if (kind==='weapon' && def.dmg!=null) {
        var oldW = itemById(P.equipped.weapon);
        var delta = def.dmg - (oldW?oldW.dmg:0);
        cmp = '<div class="stat-compare">DMG base: '+(oldW?oldW.dmg:0)+' → '+def.dmg+
          ' <span class="'+(delta>0?'up':delta<0?'down':'same')+'">'+(delta>0?'+':'')+delta+'</span></div>';
      } else if (kind!=='weapon') {
        var oldA = itemById(P.equipped[kind]);
        var oldDef = oldA && oldA.def ? oldA.def : 0;
        var newDef = def.def||0;
        var deltaA = newDef - oldDef;
        var projArm = curArm - oldDef + newDef;
        cmp = '<div class="stat-compare">DEF pieza: '+oldDef+' → '+newDef+
          ' <span class="'+(deltaA>0?'up':deltaA<0?'down':'same')+'">'+(deltaA>0?'+':'')+deltaA+'</span>'+
          ' · ARM total ≈ '+projArm+'</div>';
      }
      html += cmp;
    }
    html += '<div class="item-actions">';
    if (eq) html += '<span class="equipped-tag">EQUIPADO</span>';
    else html += '<button onclick="equipItem('+def.id+');document.getElementById(\'modal-slot\').classList.add(\'hidden\')">Equipar</button>';
    html += '</div></div>';
  });
  if (kind==='weapon' && P.equipped.weapon) {
    html += '<button class="ghost" style="width:100%" onclick="unequipWeapon();document.getElementById(\'modal-slot\').classList.add(\'hidden\')">Desequipar arma</button>';
  } else if (kind!=='weapon' && P.equipped[kind]) {
    html += '<button class="ghost" style="width:100%" onclick="unequipCloth(\''+kind+'\');document.getElementById(\'modal-slot\').classList.add(\'hidden\')">Desequipar</button>';
  }
  html += '<button class="ghost" style="width:100%;margin-top:8px" onclick="document.getElementById(\'modal-slot\').classList.add(\'hidden\')">Cerrar</button>';
  body.innerHTML = html;
  document.getElementById('modal-slot').classList.remove('hidden');
}

function renderCraft(main) {
  var tabs = [
    {id:'scrap', label:'Desguazar'},
    {id:'weapons', label:'Armas'},
    {id:'armor', label:'Atuendos'},
    {id:'ammo', label:'Munición'},
    {id:'consumables', label:'Curativos'},
  ];
  var html = '<div class="subtabs">'+tabs.map(function(t){
    return '<button class="'+(craftSub===t.id?'active':'')+'" onclick="craftSub=\''+t.id+'\';render()">'+t.label+'</button>';
  }).join('')+'</div>';

  html += '<div class="comp-bar">';
  [200,201,202,203,204].forEach(function(cid){
    var c = itemById(cid);
    html += '<span class="comp-chip '+rarityClass(c.rarity)+'">'+(c.name.replace('Componente ',''))+': <b>'+invQty(cid)+'</b></span>';
  });
  html += '</div>';

  if (craftSub === 'scrap') {
    html += '<p style="font-size:12px;color:var(--muted);margin:0 0 10px">Desguaza equipo → 1 componente de su rango.</p>';
    normalizeInv();
    var gear = P.inv.map(function(s){ return {id:s.id, qty:s.qty, def:itemById(s.id)}; })
      .filter(function(x){ return x.def && (x.def.type==='weapon'||x.def.type==='armor'); });
    if (!gear.length) html += '<div class="empty-state">Nada que desguazar.</div>';
    else {
      html += '<div class="item-list">';
      gear.forEach(function(slot){
        var def = slot.def, eq = (P.equipped.weapon===slot.id||P.equipped.armor===slot.id);
        html += '<div class="item-card"><div class="item-card-top"><div>'+
          '<div class="item-name '+rarityClass(def.rarity)+'">'+def.name+(slot.qty>1?' ×'+slot.qty:'')+(eq?' <span class="equipped-tag">EQUIP</span>':'')+'</div>'+
          '<div class="item-meta">→ '+itemById(RARITY_COMPONENT[def.rarity]||200).name+'</div></div></div>'+
          '<div class="item-actions"><button class="danger" onclick="disassembleItem('+slot.id+')">Desguazar</button></div></div>';
      });
      html += '</div>';
    }
  } else {
    var filterFn = {
      weapons: function(r){ var d=itemById(r.result); return d && d.type==='weapon'; },
      armor: function(r){ var d=itemById(r.result); return d && d.type==='armor'; },
      ammo: function(r){ return r.result >= 210 && r.result <= 213; },
      consumables: function(r){ var d=itemById(r.result); return d && d.type==='consumable'; },
    };
    var list = CRAFT_RECIPES.filter(filterFn[craftSub] || function(){ return true; });
    if (!list.length) html += '<div class="empty-state">Sin recetas en esta categoría.</div>';
    list.forEach(function(rec){
      var res = itemById(rec.result);
      var isAmmo = rec.result >= 210 && rec.result <= 213;
      var costStr = Object.keys(rec.cost).map(function(cid){
        var need = isAmmo ? rec.cost[cid] : Math.max(1, rec.cost[cid] - (getSkillBonus('craftDiscount')||0));
        var have = invQty(+cid);
        var ok = have >= need;
        return '<span style="color:'+(ok?'var(--green)':'var(--danger)')+'">'+(itemById(+cid).name.replace('Componente ',''))+': '+have+'/'+need+'</span>';
      }).join(' · ');
      var can = canCraft(rec);
      var title = rec.label || res.name;
      html += '<div class="craft-recipe"><div class="item-name '+rarityClass(res.rarity)+'">'+title+'</div>'+
        '<div class="item-meta">'+(res.desc||'')+'</div>'+
        '<div style="font-size:11px;margin-top:6px">'+costStr+'</div>'+
        '<div class="item-actions" style="margin-top:8px">'+
        (can?'<button class="green" onclick="craftRecipe(\''+rec.id+'\')">Fabricar</button>':'<button disabled>Faltan piezas</button>')+
        '</div></div>';
    });
  }
  main.innerHTML = html;
}
