<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Night City">
<meta name="description" content="Night City — supervivencia en las calles. Offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Night City</title>
<style>
:root {
  --bg: #050508; --panel: #0b0d14; --line: #00e8ff; --txt: #e8eefc;
  --accent: #00e8ff; --magenta: #ff2bd6; --danger: #ff3355; --gold: #ffc933;
  --bar-bg: #101018; --purple: #b14dff; --green: #3dde7a; --muted: #6a7a94;
  --card: #0a101a; --border: #1a2838;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0;
  background: var(--bg); color: var(--txt);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
button {
  font: inherit; color: var(--accent); background: #0a1520;
  border: 1px solid rgba(0,232,255,0.45); padding: 9px 12px; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  font-size: 12px; border-radius: 6px; transition: background .12s, transform .08s, box-shadow .12s;
}
button:active { background: #0e2a3a; transform: scale(0.97); }
button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
button.danger { border-color: var(--danger); color: var(--danger); }
button.magenta { border-color: var(--magenta); color: var(--magenta); }
button.gold { border-color: var(--gold); color: var(--gold); }
button.green { border-color: var(--green); color: var(--green); }
button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }

.app {
  display: flex; flex-direction: column; height: 100%; height: 100dvh;
  max-width: 720px; margin: 0 auto; padding: 8px;
  padding-bottom: max(8px, env(safe-area-inset-bottom)); overflow: hidden; position: relative;
}

/* ===== HUD ===== */
.hud {
  flex-shrink: 0; background: linear-gradient(180deg, #0c1018 0%, #080a10 100%);
  border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 8px;
  margin-bottom: 6px; box-shadow: 0 0 20px rgba(0,232,255,0.06);
}
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.hud-title {
  margin: 0; font-size: 16px; letter-spacing: 2px; font-weight: 800;
  background: linear-gradient(90deg, var(--accent), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hud-right { display: flex; align-items: center; gap: 8px; }
.hud-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.btn-icon {
  width: 34px; height: 34px; min-width: 34px; padding: 0; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.hud-bars { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 10px; color: var(--muted); width: 28px; flex-shrink: 0; font-weight: 600; }
.bar-track {
  flex: 1; height: 10px; background: var(--bar-bg); border-radius: 5px;
  overflow: hidden; border: 1px solid #1a2230;
}
.bar-fill { height: 100%; border-radius: 5px; transition: width .3s; }
.bar-fill.hp { background: linear-gradient(90deg, #00a8c8, var(--accent)); box-shadow: 0 0 8px rgba(0,232,255,0.35); }
.bar-fill.xp { background: linear-gradient(90deg, #a020a0, var(--magenta)); }
.bar-text { font-size: 10px; color: var(--txt); width: 64px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.hud-stats {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
}
.hud-stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 4px; text-align: center;
}
.hud-stat .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.hud-stat .val { font-size: 14px; font-weight: 700; margin-top: 2px; }
.hud-stat .val.gold { color: var(--gold); }
.hud-stat .val.accent { color: var(--accent); }
.hud-stat .val.magenta { color: var(--magenta); }
.hud-stat .val.green { color: var(--green); }

/* Loot modal */
.loot-modal-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; max-height: 40vh; overflow-y: auto; }
.loot-item-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
}
.loot-item-row .loot-name { font-weight: 700; font-size: 13px; }
.loot-item-row .loot-meta { font-size: 11px; color: var(--muted); }

/* Skill tree */
.skill-cat-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.skill-node {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px;
}
.skill-node.unlocked { border-color: var(--green); box-shadow: 0 0 8px rgba(61,222,122,0.15); }
.skill-node.locked { opacity: 0.55; }
.skill-node .sk-name { font-weight: 700; font-size: 13px; color: var(--accent); }
.skill-node .sk-desc { font-size: 11px; color: var(--muted); margin: 4px 0; }
.skill-points-badge {
  display: inline-block; background: #1a1030; border: 1px solid var(--magenta);
  color: var(--magenta); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 20px;
}

/* Craft */
.craft-recipe {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px;
}
.comp-bar {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
}
.comp-chip {
  font-size: 11px; padding: 6px 10px; border-radius: 8px;
  background: #0e1824; border: 1px solid var(--border); font-weight: 600;
}

/* Eddie transfer animation (CP style) */
.eddie-transfer {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 300; pointer-events: none; text-align: center;
  font-family: 'Segoe UI', monospace; font-weight: 800;
  animation: eddiePop 1.1s ease-out forwards;
}
.eddie-transfer .eddie-label {
  font-size: 11px; letter-spacing: 3px; color: var(--accent);
  text-transform: uppercase; margin-bottom: 4px;
  text-shadow: 0 0 10px rgba(0,232,255,0.6);
}
.eddie-transfer .eddie-amount {
  font-size: 28px; color: var(--gold);
  text-shadow: 0 0 16px rgba(255,201,51,0.7), 0 0 4px #000;
}
.eddie-transfer.spend .eddie-amount { color: var(--danger); text-shadow: 0 0 16px rgba(255,51,85,0.6); }
.eddie-transfer .eddie-bar {
  width: 140px; height: 3px; margin: 8px auto 0;
  background: #1a2030; border-radius: 2px; overflow: hidden;
}
.eddie-transfer .eddie-bar-fill {
  height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold));
  animation: eddieBar 0.9s ease-out forwards;
}
.eddie-transfer.spend .eddie-bar-fill { background: linear-gradient(90deg, var(--danger), var(--magenta)); }
@keyframes eddiePop {
  0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
}
@keyframes eddieBar {
  0% { width: 0; }
  100% { width: 100%; }
}
.ammo-row {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  margin: 8px 0; font-size: 11px;
}
.ammo-chip {
  padding: 4px 8px; border-radius: 6px; background: #0e1824;
  border: 1px solid var(--border); color: var(--accent); font-weight: 600;
}
.ammo-chip.empty { color: var(--danger); border-color: #5a2030; }
.sub-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 8px; cursor: pointer;
}
.sub-card:active { border-color: var(--accent); }
.sub-faction { font-size: 11px; color: var(--magenta); margin-top: 4px; font-weight: 600; }
.hud-stat .val.gold { font-variant-numeric: tabular-nums; }

/* Log */
.panel-log {
  flex-shrink: 0; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; max-height: 72px; overflow-y: auto;
}
.log-title { font-weight: 700; color: var(--accent); font-size: 10px; letter-spacing: 1px; margin-bottom: 2px; }
#log { font-size: 11px; line-height: 1.4; color: #a8b8d0; }
#log .sys { color: var(--accent); } #log .combat { color: var(--danger); }
#log .loot { color: var(--gold); } #log .quest { color: var(--magenta); }

/* Main */
.panel-main {
  flex: 1 1 auto; min-height: 0; overflow: hidden; margin-bottom: 6px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column;
}
.main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }

/* Tabs */
.bottom-bar { flex-shrink: 0; }
.tabs {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
}
.tabs button {
  padding: 10px 1px; font-size: 9px; font-weight: 600; border-radius: 8px;
  border-color: var(--border); color: var(--muted); background: #0a0e16;
}
.tabs button.active {
  background: var(--accent); color: #000; border-color: var(--accent);
  box-shadow: 0 0 14px rgba(0,232,255,0.35); font-weight: 800;
}

/* Map */
.loc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.loc-title { font-size: 15px; font-weight: 700; color: var(--accent); }
.loc-flavor { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
.action-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.action-row button { flex: 1; min-width: 110px; padding: 12px 10px; font-weight: 600; }
.section-label { font-size: 11px; color: var(--accent); margin: 14px 0 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.district-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.district-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 10px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.district-card.current { border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,43,214,0.2); }
.district-name { font-weight: 700; color: var(--accent); font-size: 13px; }
.district-desc { font-size: 11px; color: var(--muted); margin-top: 4px; }
.district-danger { font-size: 10px; margin-top: 6px; }
.danger-low { color: var(--green); } .danger-mid { color: var(--gold); } .danger-high { color: var(--danger); }

/* Inventory — larger cards */
.subtabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.subtabs button {
  padding: 8px 12px; font-size: 11px; border-radius: 20px; font-weight: 600;
  border-color: var(--border); color: var(--muted); background: #0a0e16;
}
.subtabs button.active { background: var(--magenta); color: #000; border-color: var(--magenta); }
.equipped-bar {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.equipped-slot {
  background: var(--card); border: 1px solid rgba(0,232,255,0.3); border-radius: 8px; padding: 10px;
}
.equipped-slot .slot-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.equipped-slot .slot-name { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 3px; }
.equipped-slot .slot-stats { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-list { display: flex; flex-direction: column; gap: 8px; }
.item-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
.item-card.equipped-item { border-color: rgba(0,232,255,0.4); }
.item-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item-name { font-weight: 700; font-size: 14px; }
.item-meta { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
.item-stats-row {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
}
.stat-chip {
  font-size: 10px; padding: 3px 8px; border-radius: 12px;
  background: #0e1824; border: 1px solid var(--border); color: var(--accent); font-weight: 600;
}
.item-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.item-actions button { padding: 8px 12px; font-size: 11px; font-weight: 600; border-radius: 6px; }
.equipped-tag {
  display: inline-block; font-size: 9px; padding: 2px 6px; margin-left: 6px;
  border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; font-weight: 700;
  vertical-align: middle;
}
.rarity-common { color: #a0b0c0; } .rarity-uncommon { color: #3dde7a; }
.rarity-rare { color: #5ba3ff; } .rarity-epic { color: var(--purple); }
.rarity-legendary { color: var(--gold); text-shadow: 0 0 8px rgba(255,201,51,0.35); }

/* Chrome silhouette */
.chrome-layout { display: flex; flex-direction: column; gap: 14px; }
.chrome-silhouette-wrap { display: flex; justify-content: center; padding: 8px 0; }
.chrome-body {
  position: relative; width: 200px; height: 320px;
}
.body-svg { width: 100%; height: 100%; }
.chrome-slot {
  position: absolute; width: 72px; min-height: 44px;
  background: rgba(10,20,32,0.92); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 5px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; transition: border-color .15s, box-shadow .15s;
  font-size: 9px; color: var(--muted);
}
.chrome-slot.filled {
  border-color: var(--accent); box-shadow: 0 0 10px rgba(0,232,255,0.25); color: var(--accent);
}
.chrome-slot .slot-title { font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 2px; }
.chrome-slot .slot-item { font-size: 10px; font-weight: 700; line-height: 1.2; color: inherit; }
.chrome-slot.empty:active, .chrome-slot:active { border-color: var(--magenta); }
.slot-optics { top: 8px; left: 50%; transform: translateX(-50%); width: 90px; }
.slot-nervous { top: 70px; left: 50%; transform: translateX(-50%); width: 90px; }
.slot-arms { top: 130px; left: 0; }
.slot-skin { top: 130px; right: 0; }
.slot-circulatory { top: 195px; left: 50%; transform: translateX(-50%); width: 90px; }
.slot-legs { top: 255px; left: 50%; transform: translateX(-50%); width: 90px; }
.chrome-shop-list { display: flex; flex-direction: column; gap: 8px; }
.chrome-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
}
.chrome-card.owned { border-color: #1a4a3a; }
.chrome-card.installed { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,232,255,0.15); }

/* Fixers */
.fixer-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; margin-bottom: 10px;
}
.fixer-name { font-size: 15px; font-weight: 700; color: var(--magenta); }
.fixer-loc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.fixer-blurb { font-size: 12px; color: #90a0b8; margin: 8px 0; line-height: 1.4; }
.gig-row {
  background: #080c14; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; margin-top: 8px;
}
.gig-row.active-gig { border-color: rgba(255,43,214,0.4); }
.gig-row.done-gig { opacity: 0.5; }
.gig-title { font-weight: 700; font-size: 13px; color: var(--accent); }
.gig-desc { font-size: 11px; color: var(--muted); margin: 4px 0; }
.gig-reward { font-size: 10px; color: var(--gold); }
.gig-progress { font-size: 11px; color: var(--green); margin-top: 4px; }

/* Character */
.char-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.char-stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; text-align: center;
}
.char-stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.char-stat .value { font-size: 20px; font-weight: 800; color: var(--accent); margin-top: 4px; }

/* Combat */
.combat-screen { text-align: center; padding: 4px 0; }
.combat-title {
  color: var(--danger); font-size: 16px; font-weight: 800; letter-spacing: 2px;
  margin-bottom: 14px; text-shadow: 0 0 12px rgba(255,51,85,0.45);
}
.combat-entity {
  margin: 10px 0; padding: 12px; background: var(--card); border-radius: 10px;
  border: 1px solid var(--border); text-align: left;
}
.combat-entity.enemy { border-color: #3a1520; }
.combat-entity.player { border-color: #0a2a3a; }
.combat-name { font-weight: 700; font-size: 14px; }
.combat-name.enemy { color: var(--danger); } .combat-name.player { color: var(--accent); }
.combat-hp-bar {
  height: 12px; background: var(--bar-bg); border-radius: 6px; overflow: hidden;
  margin-top: 6px; border: 1px solid #222;
}
.combat-hp-fill { height: 100%; transition: width .25s; border-radius: 6px; }
.combat-hp-fill.enemy { background: var(--danger); }
.combat-hp-fill.player { background: var(--accent); }
.combat-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: center; }
.combat-actions button { min-width: 110px; padding: 14px 12px; font-weight: 700; font-size: 13px; }

/* Modals */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.82);
  display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px;
}
.modal-content {
  background: var(--panel); border: 2px solid var(--accent); padding: 20px;
  max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 12px;
  box-shadow: 0 0 40px rgba(0,232,255,0.2);
}
.modal-content h2, .modal-content h3 { margin: 0 0 12px; color: var(--accent); }
.hidden { display: none !important; }
.name-input {
  width: 100%; padding: 14px; font-size: 16px; background: #0a1520;
  border: 1px solid var(--line); color: var(--txt); border-radius: 8px;
  margin: 12px 0; font-family: inherit; text-align: center;
}
.name-input:focus { outline: none; border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,43,214,0.3); }
.settings-row {
  display: flex; justify-content: space-between; align-items: center;
  margin: 10px 0; padding: 10px 0; border-bottom: 1px solid var(--border);
}
.settings-row label { font-size: 13px; }
input[type=range] { width: 120px; accent-color: var(--accent); }

.empty-state { text-align: center; color: var(--muted); padding: 24px 12px; font-size: 13px; }

@media (max-width: 400px) {
  .district-grid { grid-template-columns: 1fr; }
  .tabs button { font-size: 9px; padding: 9px 1px; }
  .hud-stats { grid-template-columns: repeat(4, 1fr); }
  .chrome-body { width: 180px; height: 300px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="hud-top">
      <h1 class="hud-title">NIGHT CITY</h1>
      <div class="hud-right">
        <span class="hud-time" id="st-time">20:47</span>
        <button class="btn-icon" id="btn-settings" title="Ajustes">⚙</button>
      </div>
    </div>
    <div class="hud-bars">
      <div class="bar-row">
        <span class="bar-label">HP</span>
        <div class="bar-track"><div class="bar-fill hp" id="hp-bar" style="width:100%"></div></div>
        <span class="bar-text"><b id="st-hp">100</b>/<b id="st-maxhp">100</b></span>
      </div>
      <div class="bar-row">
        <span class="bar-label">XP</span>
        <div class="bar-track"><div class="bar-fill xp" id="xp-bar" style="width:0%"></div></div>
        <span class="bar-text"><b id="st-xp">0</b>/<b id="st-maxxp">100</b></span>
      </div>
    </div>
    <div class="hud-stats">
      <div class="hud-stat"><div class="lbl">Nivel</div><div class="val magenta" id="st-lvl">1</div></div>
      <div class="hud-stat"><div class="lbl">Eddies</div><div class="val gold" id="st-eddies">500</div></div>
      <div class="hud-stat"><div class="lbl">Daño</div><div class="val accent" id="st-dmg">8</div></div>
      <div class="hud-stat"><div class="lbl">Armadura</div><div class="val accent" id="st-armor">0</div></div>
      <div class="hud-stat"><div class="lbl">Skill pts</div><div class="val green" id="st-sp">0</div></div>
    </div>
  </div>

const VERSION = '0.0.8';
let audioCtx = null, sfxVol = 0.7;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, volMul) {
  if (sfxVol <= 0) return;
  type = type || 'square'; volMul = volMul || 1;
  try {
    ensureAudio();
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(sfxVol * 0.15 * volMul, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { playTone(800, 0.04, 'square', 0.6); }
function sfxTab() { playTone(600, 0.05, 'triangle', 0.5); }
function sfxLoot() { playTone(1200, 0.08, 'sine', 0.7); playTone(1600, 0.1, 'sine', 0.4); }
function sfxHurt() { playTone(120, 0.15, 'sawtooth', 1); }
function sfxHeal() { playTone(500, 0.08, 'sine'); playTone(700, 0.1, 'sine', 0.5); }
function sfxLevel() { playTone(600,0.1,'sine'); setTimeout(function(){playTone(800,0.1,'sine');},80); setTimeout(function(){playTone(1000,0.15,'sine');},160); }
function sfxBuy() { playTone(900, 0.06, 'triangle'); }
function sfxError() { playTone(150, 0.2, 'square', 0.5); }
function sfxWin() { playTone(400,0.08,'sine'); setTimeout(function(){playTone(600,0.1,'sine');},60); setTimeout(function(){playTone(900,0.12,'sine');},140); }
function sfxWeapon(subtype) {
  if (subtype === 'melee') { playTone(220,0.06,'sawtooth',0.9); setTimeout(function(){playTone(180,0.08,'triangle',0.6);},40); }
  else if (subtype === 'smg' || subtype === 'rifle') { playTone(300,0.04,'square',0.7); setTimeout(function(){playTone(280,0.04,'square',0.5);},50); setTimeout(function(){playTone(260,0.05,'square',0.4);},100); }
  else if (subtype === 'shotgun') { playTone(100,0.12,'sawtooth',1); playTone(80,0.15,'square',0.6); }
  else if (subtype === 'tech' || subtype === 'smart') { playTone(900,0.05,'sine',0.8); setTimeout(function(){playTone(700,0.08,'triangle',0.5);},40); }
  else { playTone(350,0.05,'square',0.8); setTimeout(function(){playTone(200,0.06,'triangle',0.4);},30); }
}

function itemById(id) { return ITEMS.find(function(i){ return i.id === id; }); }

/* Inventory: always merge by id (fixes duplicate equipped display) */
function invQty(id) {
  var total = 0;
  P.inv.forEach(function(x){ if (x.id === id) total += x.qty; });
  return total;
}
function storageQty(id) {
  var total = 0;
  P.storage.forEach(function(x){ if (x.id === id) total += x.qty; });
  return total;
}
function mergeList(list) {
  var map = {};
  list.forEach(function(x){
    if (!map[x.id]) map[x.id] = 0;
    map[x.id] += x.qty;
  });
  return Object.keys(map).map(function(k){ return { id: +k, qty: map[k] }; });
}
function normalizeInv() {
  P.inv = mergeList(P.inv);
  P.storage = mergeList(P.storage);
}
function addItem(id, qty, toStorage) {
  qty = qty || 1; var def = itemById(id); if (!def) return;
  var list = toStorage ? P.storage : P.inv;
  var existing = list.find(function(x){ return x.id === id; });
  if (existing) existing.qty += qty;
  else list.push({ id:id, qty:qty });
}
function removeItem(id, qty, fromStorage) {
  qty = qty || 1;
  var list = fromStorage ? P.storage : P.inv;
  var existing = list.find(function(x){ return x.id === id; });
  if (!existing || existing.qty < qty) return false;
  existing.qty -= qty;
  if (existing.qty <= 0) {
    var idx = list.findIndex(function(x){ return x.id === id; });
    list.splice(idx, 1);
  }
  return true;
}
function availableQty(id) {
  /* qty in inv that is not the equipped weapon/armor instance */
  var q = invQty(id);
  if (P.equipped.weapon === id || P.equipped.armor === id) q = Math.max(0, q - 1);
  return q;
}

function getSkillBonus(key) {
  var total = 0;
  (P.unlockedSkills || []).forEach(function(sid){
    Object.keys(SKILL_TREE).forEach(function(cat){
      SKILL_TREE[cat].nodes.forEach(function(n){
        if (n.id === sid && n.effect && n.effect[key]) total += n.effect[key];
      });
    });
  });
  return total;
}
function getWeaponDmg() {
  var w = itemById(P.equipped.weapon); var dmg = w ? w.dmg : 4;
  Object.keys(P.equipped.cyberware || {}).forEach(function(slot){
    var c = itemById(P.equipped.cyberware[slot]);
    if (c && c.bonusDmg) dmg += c.bonusDmg;
  });
  dmg += getSkillBonus('dmg');
  return dmg;
}
function getArmorDef() {
  var a = itemById(P.equipped.armor); var def = a ? a.def : 0;
  Object.keys(P.equipped.cyberware || {}).forEach(function(slot){
    var c = itemById(P.equipped.cyberware[slot]);
    if (c && c.bonusDef) def += c.bonusDef;
  });
  def += getSkillBonus('def');
  return def;
}
function getCyberHpBonus() {
  var bonus = 0;
  Object.keys(P.equipped.cyberware || {}).forEach(function(slot){
    var c = itemById(P.equipped.cyberware[slot]);
    if (c && c.bonusHp) bonus += c.bonusHp;
  });
  bonus += getSkillBonus('maxHp');
  return bonus;
}
function installedChromeCount() {
  return Object.keys(P.equipped.cyberware || {}).filter(function(k){ return P.equipped.cyberware[k]; }).length;
}
function recalcMaxHp() {
  P.maxHp = 100 + (P.lvl - 1) * 12 + getCyberHpBonus();
  if (P.hp > P.maxHp) P.hp = P.maxHp;
}

function save() {
  try { localStorage.setItem('nightcity_v008', JSON.stringify(P)); return true; } catch(e){ return false; }
}
function load() {
  try {
    var raw = localStorage.getItem('nightcity_v008') || localStorage.getItem('nightcity_v007') || localStorage.getItem('nightcity_v006') || localStorage.getItem('nightcity_v005');
    if (!raw) return false;
    var data = JSON.parse(raw);
    Object.assign(P, data);
    if (!P.storage) P.storage = [];
    if (!P.ownedChrome) P.ownedChrome = [];
    if (!P.completedQuests) P.completedQuests = [];
    if (!P.activeQuests) P.activeQuests = P.quests || [];
    if (!P.unlockedSkills) P.unlockedSkills = [];
    if (P.skillPoints === undefined) P.skillPoints = Math.max(0, P.lvl - 1);
    if (!P.pendingLoot) P.pendingLoot = null;
    if (!P.mapView) P.mapView = 'city';
    if (P.viewDistrict === undefined) P.viewDistrict = null;
    if (P.viewSub === undefined) P.viewSub = null;
    if (Array.isArray(P.equipped.cyberware)) {
      var map = {};
      P.equipped.cyberware.forEach(function(cid){
        var c = itemById(cid);
        if (c && c.slot) map[c.slot] = cid;
      });
      P.equipped.cyberware = map;
    }
    if (!P.equipped.cyberware || Array.isArray(P.equipped.cyberware)) P.equipped.cyberware = {};
    normalizeInv();
    recalcMaxHp();
    return true;
  } catch(e){ return false; }
}

function logMsg(msg, cls) {
  P.log.unshift({ msg:msg, cls:cls||'', t:Date.now() });
  if (P.log.length > 50) P.log.pop();

}
function renderLog() {
  var el = document.getElementById('log'); if (!el) return;
  el.innerHTML = P.log.slice(0,6).map(function(l){ return '<div class="'+(l.cls||'')+'">'+l.msg+'</div>'; }).join('');
}
function updateStats() {
  document.getElementById('st-hp').textContent = Math.max(0, Math.floor(P.hp));
  document.getElementById('st-maxhp').textContent = P.maxHp;
  document.getElementById('st-lvl').textContent = P.lvl;
  document.getElementById('st-xp').textContent = P.xp;
  document.getElementById('st-maxxp').textContent = P.maxXp;
  document.getElementById('st-eddies').textContent = P.eddies;
  document.getElementById('st-armor').textContent = getArmorDef();
  document.getElementById('st-dmg').textContent = getWeaponDmg();
  var spEl = document.getElementById('st-sp');
  if (spEl) spEl.textContent = P.skillPoints || 0;
  document.getElementById('hp-bar').style.width = Math.min(100, (P.hp / Math.max(1,P.maxHp)) * 100) + '%';
  document.getElementById('xp-bar').style.width = Math.min(100, (P.xp / Math.max(1,P.maxXp)) * 100) + '%';
  document.getElementById('st-time').textContent = String(P.hours).padStart(2,'0')+':'+String(P.minutes).padStart(2,'0');
}

/* Cyberpunk-style eddie transfer animation */
function changeEddies(delta, silent) {
  if (!delta) return;
  P.eddies = Math.max(0, P.eddies + delta);
  if (!silent) showEddieTransfer(delta);
  updateStats();
}
function showEddieTransfer(delta) {
  var el = document.createElement('div');
  el.className = 'eddie-transfer' + (delta < 0 ? ' spend' : '');
  var label = delta > 0 ? 'TRANSFER IN' : 'TRANSFER OUT';
  var sign = delta > 0 ? '+' : '';
  el.innerHTML = '<div class="eddie-label">'+label+'</div>'+
    '<div class="eddie-amount">'+sign+delta+' €$</div>'+
    '<div class="eddie-bar"><div class="eddie-bar-fill"></div></div>';
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
}
function addXp(amount) {
  P.xp += amount; logMsg('+'+amount+' XP', 'sys');
  while (P.xp >= P.maxXp) {
    P.xp -= P.maxXp; P.lvl++; P.maxXp = Math.floor(P.maxXp * 1.35);
    P.skillPoints = (P.skillPoints || 0) + 1;
    recalcMaxHp(); P.hp = P.maxHp; sfxLevel();
    logMsg('¡NIVEL '+P.lvl+'! +1 punto de habilidad. Max HP aumentado.', 'quest');
    checkQuests();
  }
  updateStats();
}
function heal(amount) { P.hp = Math.min(P.maxHp, P.hp + amount); updateStats(); }
function advanceTime(mins) {
  P.minutes += mins;
  while (P.minutes >= 60) { P.minutes -= 60; P.hours++; }
  if (P.hours >= 24) P.hours -= 24;
  updateStats();
}

/* ===== QUESTS / FIXERS ===== */
function getQuestDef(id) { return QUESTS_POOL.find(function(q){ return q.id === id; }); }
function isQuestActive(id) { return P.activeQuests.some(function(q){ return q.id === id && !q.done; }); }
function isQuestCompleted(id) { return P.completedQuests.indexOf(id) >= 0 || P.activeQuests.some(function(q){ return q.id === id && q.done; }); }
function acceptQuest(qid) {
  if (isQuestActive(qid) || isQuestCompleted(qid)) { sfxError(); logMsg('Ese gig ya no está disponible.', 'sys'); return; }
  var def = getQuestDef(qid); if (!def) return;
  var activeCount = P.activeQuests.filter(function(q){ return !q.done; }).length;
  if (activeCount >= 4) { sfxError(); logMsg('Máximo 4 gigs activos. Completa alguno primero.', 'sys'); return; }
  P.activeQuests.push(Object.assign({}, def, { progress:0, done:false }));
  sfxClick(); logMsg('Gig aceptado: '+def.title, 'quest'); save(); render();
}
function checkQuests() {
  P.activeQuests.forEach(function(q){
    if (q.done) return;
    if (q.type === 'level' && P.lvl >= q.target) { q.progress = q.target; completeQuest(q); }
  });
}
function onKill(enemy) {
  var g = enemy.gang || 'other';
  P.kills[g] = (P.kills[g]||0) + 1;
  P.activeQuests.forEach(function(q){
    if (q.done) return;
    if (q.type === 'kill' && q.gang === g) {
      q.progress = Math.min(q.target, (q.progress||0)+1);
      if (q.progress >= q.target) completeQuest(q);
    }
    if (q.type === 'kill_legend' && enemy.legendary) {
      q.progress = Math.min(q.target, (q.progress||0)+1);
      if (q.progress >= q.target) completeQuest(q);
    }
  });
}
function completeQuest(q) {
  if (q.done) return; q.done = true;
  if (P.completedQuests.indexOf(q.id) < 0) P.completedQuests.push(q.id);
  var r = q.reward;
  if (r.eddies) { changeEddies(r.eddies); logMsg('+'+r.eddies+' €$', 'loot'); }
  if (r.xp) addXp(r.xp);
  if (r.item) { addItem(r.item, r.qty||1); logMsg('Obtenido: '+itemById(r.item).name, 'loot'); }
  sfxWin(); logMsg('GIG COMPLETADO: '+q.title, 'quest'); save();
}

/* ===== COMBAT ===== */
function startCombat(enemyTemplate) {
  var e = Object.assign({}, enemyTemplate);
  e.hp = e.hp + Math.floor(Math.random()*8); e.maxHp = e.hp; e.droppedLoot = [];
  if (e.loot && e.loot.length) {
    var numDrops = 1 + (Math.random() < 0.35 ? 1 : 0);
    var shuffled = e.loot.slice().sort(function(){ return Math.random()-0.5; });
    for (var i=0; i<Math.min(numDrops, shuffled.length); i++) {
      if (Math.random() < 0.75) e.droppedLoot.push(shuffled[i]);
    }
  }
  P.combat = { enemy:e, turn:'player' };
  logMsg('¡Combate! '+e.name+' aparece.', 'combat'); render();
}
function combatAttack() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var e = P.combat.enemy, w = itemById(P.equipped.weapon);
  var subtype = w ? (w.subtype || 'pistol') : 'melee';
  var ammoKey = ammoKeyForSubtype(subtype);
  if (ammoKey) {
    var ammoId = AMMO_TYPES[ammoKey].id;
    var cost = ammoCostForSubtype(subtype);
    if (invQty(ammoId) < cost) {
      sfxError();
      logMsg('Sin munición ('+AMMO_TYPES[ammoKey].name+'). Usa melee o recarga.', 'combat');
      return;
    }
    removeItem(ammoId, cost);
    logMsg('−'+cost+' '+AMMO_TYPES[ammoKey].name, 'sys');
  }
  sfxWeapon(subtype);
  var dmg = Math.max(1, getWeaponDmg() + Math.floor(Math.random()*5) - 1);
  e.hp -= dmg;
  logMsg('Atacas a '+e.name+' con '+(w?w.name:'puños')+' por '+dmg+'.', 'combat');
  if (e.hp <= 0) { endCombat(true); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}
function combatHeal() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var meds = [60,59,55,52,51,53,50,58,54], used = false;
  for (var i=0;i<meds.length;i++) {
    if (invQty(meds[i]) > 0) {
      var it = itemById(meds[i]); removeItem(meds[i],1); heal(it.heal); sfxHeal();
      logMsg('Usas '+it.name+' (+'+it.heal+' HP).', 'sys'); used = true; break;
    }
  }
  if (!used) { sfxError(); logMsg('No tienes estimulantes.', 'sys'); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}
function combatFlee() {
  if (!P.combat) return;
  var chance = 0.55 + getSkillBonus('fleeBonus');
  if (Math.random() < chance) { logMsg('Escapas por los callejones.', 'sys'); sfxClick(); P.combat = null; advanceTime(5); render(); }
  else { logMsg('¡No puedes escapar!', 'combat'); sfxError(); P.combat.turn = 'enemy'; setTimeout(enemyTurn, 400); render(); }
}
function enemyTurn() {
  if (!P.combat) return;
  var e = P.combat.enemy, raw = e.dmg + Math.floor(Math.random()*4);
  var dmg = Math.max(1, raw - Math.floor(getArmorDef()*0.6));
  P.hp -= dmg; sfxHurt(); logMsg(e.name+' te golpea por '+dmg+'.', 'combat');
  if (P.hp <= 0) {
    P.hp = 0; logMsg('Has caído... Un fixer te arrastra al ripperdoc. Pierdes eddies.', 'combat');
    var loss = Math.floor(P.eddies*0.15);
    if (loss > 0) changeEddies(-loss);
    P.hp = Math.floor(P.maxHp*0.4); P.combat = null; advanceTime(60); save(); render(); return;
  }
  P.combat.turn = 'player'; updateStats(); render();
}
function endCombat(won) {
  var e = P.combat.enemy; P.combat = null;
  if (won) {
    sfxWin(); logMsg('Has derrotado a '+e.name+'.', 'combat');
    var gain = e.eddies[0] + Math.floor(Math.random()*(e.eddies[1]-e.eddies[0]+1));
    var eddiesPct = getSkillBonus('eddiesPct');
    gain = Math.floor(gain * (1 + eddiesPct));
    addXp(12 + e.level*4);
    onKill(e); advanceTime(8);
    /* Build loot menu — player chooses what to take */
    var lootItems = (e.droppedLoot || []).slice();
    P.pendingLoot = { eddies: gain, items: lootItems, enemyName: e.name };
    save();
    render();
    openLootModal();
    return;
  }
  save(); render();
}

function openLootModal() {
  if (!P.pendingLoot) return;
  var loot = P.pendingLoot;
  document.getElementById('loot-eddies').textContent = loot.eddies > 0 ? ('€$ ' + loot.eddies + ' disponibles') : 'Sin eddies';
  var list = document.getElementById('loot-list');
  if (!loot.items.length) {
    list.innerHTML = '<div class="empty-state" style="padding:8px">No llevaba objetos.</div>';

        '<div class="loot-meta">'+(def.desc||'')+' · '+(def.rarity||'')+'</div></div>'+
        '<button class="green" onclick="takeLootItem('+idx+')">Coger</button></div>';
    }).join('');

}
function takeLootItem(idx) {
  if (!P.pendingLoot || !P.pendingLoot.items[idx]) return;

  var def = itemById(lid);
  addItem(lid, 1);

    P.activeQuests.forEach(function(q){
      if (q.type === 'loot_cyber' && !q.done) {
        q.progress = (q.progress||0)+1;
        if (q.progress >= q.target) completeQuest(q);
      }

function takeAllLoot() {

    changeEddies(P.pendingLoot.eddies);
    logMsg('+'+P.pendingLoot.eddies+' €$', 'loot');

function closeLootModal() {

      changeEddies(P.pendingLoot.eddies);
      logMsg('+'+P.pendingLoot.eddies+' €$ (recogidos al cerrar)', 'loot');

/* ===== WORLD ===== */
function explore() {
  if (P.combat) return; sfxClick();
  advanceTime(12 + Math.floor(Math.random()*18));
  var dist = DISTRICTS.find(function(d){ return d.id === (P.viewDistrict||P.district); });
  var sub = dist && dist.subs && P.viewSub ? dist.subs.find(function(s){ return s.id === P.viewSub; }) : null;
  var danger = sub ? sub.danger : (dist ? dist.danger : 2);
  var faction = sub ? sub.faction : null;
  var roll = Math.random(), dangerMod = (danger||2)*0.07;
  if (roll < 0.38 + dangerMod) {
    var maxLvl = Math.min(P.lvl+3, 15);
    var pool = ENEMIES.filter(function(e){
      var lvlOk = e.level <= maxLvl && e.level >= Math.max(1, P.lvl-3);
      if (faction && Math.random() < 0.65) return lvlOk && e.gang === faction;
      return lvlOk;
    });
    if (!pool.length) pool = ENEMIES.filter(function(e){ return e.level <= maxLvl; });
    var enemy = pool[Math.floor(Math.random()*pool.length)] || ENEMIES[0];
    if ((danger >= 5 && Math.random() < 0.14) || Math.random() < 0.06)
      enemy = ENEMIES.find(function(e){ return e.legendary; }) || enemy;
    startCombat(enemy);
  } else if (roll < 0.52) {
    var gain = 12 + Math.floor(Math.random()*45) + danger*6;
    changeEddies(gain); sfxLoot(); logMsg('Encuentras '+gain+' €$.', 'loot'); save(); render();
  } else if (roll < 0.68) {
    var pool = ITEMS.filter(function(i){ return (i.rarity==='common'||i.rarity==='uncommon') && (i.type==='consumable'||i.type==='weapon'||i.type==='armor'||i.type==='ammo'); });
    var it = pool[Math.floor(Math.random()*pool.length)];
    addItem(it.id, it.type==='ammo' ? 10+Math.floor(Math.random()*15) : 1); sfxLoot(); logMsg('Encuentras: '+it.name, 'loot'); save(); render();
  } else if (roll < 0.78) { logMsg('Calles vacías... solo neones y un drone lejano.', 'sys'); render(); }
  else if (roll < 0.88) {
    if (P.eddies >= 40) { changeEddies(-40); addItem(50,1); logMsg('Compras un MaxDoc Mk.1 por 40 €$.', 'loot'); sfxBuy(); }
    else logMsg('Un vendedor te ofrece algo, pero no te llega el dinero.', 'sys');
    save(); render();
  } else if (roll < 0.94) { logMsg('Oyes disparos a lo lejos.', 'sys'); render(); }
  else {
    var cheapChrome = [113,112,100,105], cid = cheapChrome[Math.floor(Math.random()*cheapChrome.length)];
    if (!P.ownedChrome.includes(cid) && invQty(cid)===0) { addItem(cid,1); sfxLoot(); logMsg('¡Chrome abandonado: '+itemById(cid).name+'!', 'loot'); }
    else { var g2 = 30+Math.floor(Math.random()*50); changeEddies(g2); logMsg('Encuentras '+g2+' €$.', 'loot'); }
    save(); render();
  }
  updateStats();
}
function restAtMotel() {
  if (P.combat) return;
  if (P.eddies < 40) { sfxError(); logMsg('No tienes eddies para el motel.', 'sys'); return; }
  changeEddies(-40); P.hp = P.maxHp; advanceTime(300); sfxHeal();

/* ===== EQUIP / CHROME ===== */
function equipItem(id) {
  var def = itemById(id); if (!def) return;
  if (invQty(id) <= 0) { sfxError(); return; }
  sfxClick();
  if (def.type === 'weapon') P.equipped.weapon = id;
  else if (def.type === 'armor') P.equipped.armor = id;
  save(); render();
}
function unequipWeapon() {
  P.equipped.weapon = null; sfxClick(); save(); render();
}
function unequipArmor() {
  P.equipped.armor = null; sfxClick(); save(); render();
}
function useItem(id) {
  var def = itemById(id); if (!def || def.type !== 'consumable' || invQty(id)<=0) return;
  removeItem(id,1); heal(def.heal||0); sfxHeal(); logMsg('Usas '+def.name+' (+'+def.heal+' HP).', 'sys'); save(); render();
}
function ownsChrome(id) {
  return P.ownedChrome.indexOf(id) >= 0 || invQty(id) > 0;
}
function installChrome(id) {
  var def = itemById(id); if (!def || def.type !== 'cyberware') return;
  if (!ownsChrome(id)) { sfxError(); logMsg('No posees ese chrome.', 'sys'); return; }
  if (!P.equipped.cyberware) P.equipped.cyberware = {};
  /* free inv copy into owned */
  if (invQty(id) > 0 && P.ownedChrome.indexOf(id) < 0) {
    removeItem(id,1); P.ownedChrome.push(id);
  } else if (invQty(id) > 0 && !(P.equipped.cyberware[def.slot] === id)) {
    /* already owned, item in inv is extra - just use owned */
  }
  P.equipped.cyberware[def.slot] = id;
  recalcMaxHp(); sfxBuy(); logMsg('Instalado: '+def.name, 'sys');
  document.getElementById('modal-slot').classList.add('hidden');
  save(); render();
}
function uninstallChromeSlot(slot) {
  if (!P.equipped.cyberware || !P.equipped.cyberware[slot]) return;
  var id = P.equipped.cyberware[slot];
  delete P.equipped.cyberware[slot];
  if (P.ownedChrome.indexOf(id) < 0) P.ownedChrome.push(id);
  recalcMaxHp(); sfxClick(); logMsg('Chrome desinstalado.', 'sys');
  document.getElementById('modal-slot').classList.add('hidden');
  save(); render();
}
function buyChrome(id) {
  var def = itemById(id); if (!def) return;
  if (ownsChrome(id)) { sfxError(); logMsg('Ya posees ese chrome.', 'sys'); return; }
  if (P.eddies < def.value) { sfxError(); logMsg('No tienes suficientes eddies.', 'sys'); return; }
  changeEddies(-def.value); P.ownedChrome.push(id); sfxBuy();
  logMsg('Chrome adquirido: '+def.name+' (−'+def.value+' €$)', 'loot'); save(); render();
}
function openSlotModal(slot) {
  sfxClick();
  var body = document.getElementById('modal-slot-body');
  var slotInfo = CHROME_SLOTS.find(function(s){ return s.id === slot; });
  var installedId = (P.equipped.cyberware || {})[slot];
  var installed = installedId ? itemById(installedId) : null;
  var options = CHROME_SHOP.map(itemById).filter(function(c){ return c && c.slot === slot; });
  var html = '<h3>'+(slotInfo?slotInfo.label:slot)+'</h3>';
  if (installed) {
    html += '<div class="chrome-card installed" style="margin-bottom:10px"><div class="item-name '+rarityClass(installed.rarity)+'">'+installed.name+'</div>'+
      '<div class="item-meta">'+installed.desc+'</div><div class="stat-chip" style="margin-top:6px">'+(installed.ability||'')+'</div>'+
      '<button class="danger" style="margin-top:8px;width:100%" onclick="uninstallChromeSlot(\''+slot+'\')">Desinstalar</button></div>';
  } else {
    html += '<p style="font-size:12px;color:var(--muted)">Slot vacío. Elige chrome para instalar:</p>';
  }
  options.forEach(function(c){
    var owned = ownsChrome(c.id);
    var isInst = installedId === c.id;
    html += '<div class="chrome-card '+(isInst?'installed':owned?'owned':'')+'" style="margin-bottom:8px">'+
      '<div class="item-name '+rarityClass(c.rarity)+'">'+c.name+'</div>'+
      '<div class="item-meta">'+c.desc+'</div>'+
      '<div class="item-stats-row"><span class="stat-chip">'+(c.ability||'')+'</span><span class="stat-chip">'+c.value+' €$</span></div><div style="margin-top:8px">';
    if (isInst) html += '<button disabled>Instalado</button>';
    else if (owned) html += '<button class="green" onclick="installChrome('+c.id+')">Instalar</button>';
    else html += '<button class="gold" onclick="buyChrome('+c.id+')">Comprar</button>';
    html += '</div></div>';
  });
  html += '<button class="ghost" style="width:100%;margin-top:8px" onclick="document.getElementById(\'modal-slot\').classList.add(\'hidden\')">Cerrar</button>';
  body.innerHTML = html;
  document.getElementById('modal-slot').classList.remove('hidden');
}

var SHOP_WEAPONS = [1,2,3,4,5,6,7,8,28,29,33,34,36,38,41,42];

/* ===== CRAFT / DISASSEMBLE ===== */
function disassembleItem(id) {
  var def = itemById(id);
  if (!def || (def.type !== 'weapon' && def.type !== 'armor')) {
    sfxError(); logMsg('Solo puedes desguazar armas y atuendos.', 'sys'); return;
  }
  if (P.equipped.weapon === id || P.equipped.armor === id) {
    if (availableQty(id) <= 0) { sfxError(); logMsg('Desequipa antes de desguazar tu única unidad.', 'sys'); return; }
  }
  if (invQty(id) <= 0) return;
  var compId = RARITY_COMPONENT[def.rarity] || RARITY_COMPONENT.common;
  var qty = 1 + getSkillBonus('scrapBonus');
  removeItem(id, 1);
  addItem(compId, qty);
  sfxBuy();
  logMsg('Desguazado: '+def.name+' → '+qty+'× '+itemById(compId).name, 'loot');
  save(); render();
}
function canCraft(recipe) {
  var discount = getSkillBonus('craftDiscount') || 0;
  var isAmmo = recipe.result >= 210 && recipe.result <= 213;
  var ok = true;
  Object.keys(recipe.cost).forEach(function(cid){
    var need = isAmmo ? recipe.cost[cid] : Math.max(1, recipe.cost[cid] - discount);
    if (invQty(+cid) < need) ok = false;
  });
  return ok;
}
function craftRecipe(rid) {
  var recipe = CRAFT_RECIPES.find(function(r){ return r.id === rid; });
  if (!recipe) return;
  if (!canCraft(recipe)) { sfxError(); logMsg('Te faltan componentes.', 'sys'); return; }
  var discount = getSkillBonus('craftDiscount') || 0;
  Object.keys(recipe.cost).forEach(function(cid){
    var need = Math.max(1, recipe.cost[cid] - (recipe.result >= 210 && recipe.result <= 213 ? 0 : discount));
    if (recipe.result >= 210 && recipe.result <= 213) need = recipe.cost[cid];
    removeItem(+cid, need);
  });
  var qty = recipe.qty || 1;
  addItem(recipe.result, qty);
  sfxWin();
  logMsg('Fabricado: '+itemById(recipe.result).name+(qty>1?' ×'+qty:''), 'loot');
  save(); render();
}

/* ===== SKILLS ===== */
function isSkillUnlocked(id) { return (P.unlockedSkills || []).indexOf(id) >= 0; }
function canUnlockSkill(node) {
  if (isSkillUnlocked(node.id)) return false;
  if ((P.skillPoints || 0) < node.cost) return false;
  if (node.req && !isSkillUnlocked(node.req)) return false;
  return true;
}
function unlockSkill(sid) {
  var node = null;
  Object.keys(SKILL_TREE).forEach(function(cat){
    SKILL_TREE[cat].nodes.forEach(function(n){ if (n.id === sid) node = n; });
  });
  if (!node || !canUnlockSkill(node)) { sfxError(); return; }
  P.skillPoints -= node.cost;
  P.unlockedSkills.push(sid);
  recalcMaxHp();
  sfxLevel();
  logMsg('Habilidad desbloqueada: '+node.name, 'quest');
  save(); render();
}

function rarityClass(r) { return 'rarity-'+(r||'common'); }

/* ===== RENDER ===== */
function render() {
  updateStats(); renderLog();
  var main = document.getElementById('main');
  if (P.combat) { renderCombat(main); return; }
  if (currentTab==='map') renderMap(main);
  else if (currentTab==='inv') renderInv(main);
  else if (currentTab==='chrome') renderChrome(main);
  else if (currentTab==='fixers') renderFixers(main);
  else if (currentTab==='craft') renderCraft(main);
  else if (currentTab==='skills') renderSkills(main);
  else if (currentTab==='apt') renderApt(main);
  else if (currentTab==='shop') renderShop(main);
}

function renderCombat(main) {
  var e = P.combat.enemy, w = itemById(P.equipped.weapon);
  var ePct = Math.max(0,(e.hp/e.maxHp)*100), pPct = Math.max(0,(P.hp/P.maxHp)*100);

      a.name.replace('Munición ','')+': '+q+(active?' ◈':'')+'</span>';
  });
  ammoHtml += '</div>';
  if (!ammoKey) ammoHtml += '<div style="font-size:11px;color:var(--green);margin-bottom:6px">Cuerpo a cuerpo — no gasta munición</div>';

    '<div class="combat-entity enemy"><div class="combat-name enemy">'+e.name+'</div>'+
    '<div style="font-size:11px;color:var(--muted)">'+(e.gang||'')+' · Nv '+e.level+'</div>'+
    '<div class="combat-hp-bar"><div class="combat-hp-fill enemy" style="width:'+ePct+'%"></div></div>'+
    '<div style="font-size:12px;margin-top:4px">'+Math.max(0,Math.floor(e.hp))+' / '+e.maxHp+'</div></div>'+
    '<div class="combat-entity player"><div class="combat-name player">'+P.name+'</div>'+
    '<div style="font-size:11px;color:var(--muted)">'+(w?w.name:'Puños')+' · ARM '+getArmorDef()+' · DMG '+getWeaponDmg()+'</div>'+
    '<div class="combat-hp-bar"><div class="combat-hp-fill player" style="width:'+pPct+'%"></div></div>'+
    '<div style="font-size:12px;margin-top:4px">'+Math.floor(P.hp)+' / '+P.maxHp+'</div></div>'+
    ammoHtml+
    '<div class="combat-actions"><button onclick="combatAttack()" '+(P.combat.turn!=='player'?'disabled':'')+'>ATACAR</button>'+
    '<button onclick="combatHeal()" '+(P.combat.turn!=='player'?'disabled':'')+'>CURAR</button>'+
    '<button class="danger" onclick="combatFlee()" '+(P.combat.turn!=='player'?'disabled':'')+'>HUIR</button></div></div>';

function renderMap(main) {
  if (P.mapView === 'sub' && P.viewDistrict && P.viewSub) {
    var dist = DISTRICTS.find(function(d){ return d.id===P.viewDistrict; });
    var sub = dist.subs.find(function(s){ return s.id===P.viewSub; });
    var dClass = sub.danger<=2?'danger-low':sub.danger<=3?'danger-mid':'danger-high';
    var dLabel = sub.danger<=2?'Bajo':sub.danger<=3?'Medio':'Alto';

function renderInv(main) {
  var filters = [
    {id:'all',label:'Todo'},{id:'weapon',label:'Armas'},{id:'armor',label:'Atuendos'},
    {id:'consumable',label:'Curativos'},{id:'ammo',label:'Munición'},{id:'cyberware',label:'Chrome'},{id:'component',label:'Comp.'}
  ];
  var w = itemById(P.equipped.weapon), a = itemById(P.equipped.armor);
  var html = '<div class="equipped-bar">'+
    '<div class="equipped-slot"><div class="slot-lbl">Arma equipada</div>'+
    '<div class="slot-name">'+(w?w.name:'— Ninguna —')+'</div>'+
    '<div class="slot-stats">'+(w?'DMG '+w.dmg+' · '+w.subtype:'')+'</div></div>'+
    '<div class="equipped-slot"><div class="slot-lbl">Atuendo equipado</div>'+
    '<div class="slot-name">'+(a?a.name:'— Ninguno —')+'</div>'+
    '<div class="slot-stats">'+(a?'DEF '+a.def:'')+'</div></div></div>';
  html += '<div class="subtabs">'+filters.map(function(f){
    return '<button class="'+(invSub===f.id?'active':'')+'" onclick="invSub=\''+f.id+'\';render()">'+f.label+'</button>';
  }).join('')+'</div><div class="item-list">';

  normalizeInv();
  var items = P.inv.map(function(slot){ return {id:slot.id, qty:slot.qty, def:itemById(slot.id)}; }).filter(function(x){ return x.def; });
  var filtered = invSub==='all' ? items : items.filter(function(x){ return x.def.type===invSub; });

  if (!filtered.length) html += '<div class="empty-state">Inventario vacío en esta categoría.</div>';
  else filtered.forEach(function(slot){
    var id=slot.id, qty=slot.qty, def=slot.def;
    var isEqW = P.equipped.weapon === id;
    var isEqA = P.equipped.armor === id;
    var isEqC = Object.keys(P.equipped.cyberware||{}).some(function(s){ return P.equipped.cyberware[s]===id; });
    var isEq = isEqW || isEqA || isEqC;
    /* show total qty; if equipped, still one entry (not duplicated) */
    var displayQty = qty;
    var eqTag = isEq ? '<span class="equipped-tag">EQUIPADO</span>' : '';

    var chips = '';
    if (def.type==='weapon') chips = '<span class="stat-chip">DMG '+def.dmg+'</span><span class="stat-chip">'+def.subtype+'</span><span class="stat-chip">'+(def.rarity||'')+'</span>';
    else if (def.type==='armor') chips = '<span class="stat-chip">DEF '+def.def+'</span><span class="stat-chip">'+(def.rarity||'')+'</span>';
    else if (def.type==='consumable') chips = '<span class="stat-chip">+'+def.heal+' HP</span>';
    else if (def.type==='cyberware') chips = '<span class="stat-chip">'+(def.ability||def.slot)+'</span>';
    else if (def.type==='component') chips = '<span class="stat-chip">Desguace</span>';
    else if (def.type==='ammo') chips = '<span class="stat-chip">Munición</span>';
    chips += '<span class="stat-chip">'+def.value+' €$</span>';

    var actions = '';
    if (def.type==='weapon') {
      if (isEqW) actions = '<button class="ghost" onclick="unequipWeapon()">Desequipar</button>';
      else actions = '<button onclick="equipItem('+id+')">Equipar</button>';
      actions += '<button class="danger" onclick="disassembleItem('+id+')">Desguazar</button>';
    } else if (def.type==='armor') {
      if (isEqA) actions = '<button class="ghost" onclick="unequipArmor()">Desequipar</button>';
      else actions = '<button onclick="equipItem('+id+')">Equipar</button>';
      actions += '<button class="danger" onclick="disassembleItem('+id+')">Desguazar</button>';
    } else if (def.type==='cyberware') {
      actions = isEqC
        ? '<button class="danger" onclick="uninstallChromeSlot(\''+def.slot+'\')">Quitar</button>'
        : '<button onclick="installChrome('+id+')">Instalar</button>';
    } else if (def.type==='consumable') {
      actions = '<button class="green" onclick="useItem('+id+')">Usar</button>';
    }
    if (def.type !== 'component' && def.type !== 'ammo') {
      actions += '<button class="gold" onclick="sellItem('+id+')">Vender</button>';
      actions += '<button class="ghost" onclick="moveToStorage('+id+')">Almacén</button>';
    } else {
      actions += '<button class="gold" onclick="sellItem('+id+')">Vender</button>';
    }

    html += '<div class="item-card'+(isEq?' equipped-item':'')+'"><div class="item-card-top"><div>'+
      '<div class="item-name '+rarityClass(def.rarity)+'">'+def.name+(displayQty>1?' ×'+displayQty:'')+eqTag+'</div>'+
      '<div class="item-meta">'+def.desc+'</div>'+
      '<div class="item-stats-row">'+chips+'</div></div></div>'+
      '<div class="item-actions">'+actions+'</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
}

function renderFixers(main) {
  var active = P.activeQuests.filter(function(q){ return !q.done; });
  var html = '';
  if (active.length) {
    html += '<div class="section-label">Gigs activos ('+active.length+'/4)</div>';
    active.forEach(function(q){
      html += '<div class="gig-row active-gig"><div class="gig-title">'+q.title+'</div>'+
        '<div class="gig-desc">'+q.desc+'</div>'+
        '<div class="gig-progress">Progreso: '+(q.progress||0)+' / '+q.target+'</div>'+
        '<div class="gig-reward">'+(q.reward.eddies||0)+' €$ · '+(q.reward.xp||0)+' XP'+(q.reward.item?' · '+itemById(q.reward.item).name:'')+'</div></div>';
    });
  } else {
    html += '<div class="empty-state" style="padding:12px">Ningún gig activo. Habla con un fixer para aceptar trabajo.</div>';
  }
  html += '<div class="section-label">Fixers de Night City</div>';
  FIXERS.forEach(function(f){
    var dist = DISTRICTS.find(function(d){ return d.id === f.district; });
    html += '<div class="fixer-card"><div class="fixer-name">'+f.name+'</div>'+
      '<div class="fixer-loc">'+(dist?dist.name:f.district)+'</div>'+
      '<div class="fixer-blurb">'+f.blurb+'</div>';
    f.gigs.forEach(function(qid){
      var def = getQuestDef(qid); if (!def) return;
      var done = isQuestCompleted(qid);
      var act = isQuestActive(qid);
      html += '<div class="gig-row '+(done?'done-gig':act?'active-gig':'')+'">'+
        '<div class="gig-title">'+(done?'✓ ':'')+def.title+'</div>'+
        '<div class="gig-desc">'+def.desc+'</div>'+
        '<div class="gig-reward">'+(def.reward.eddies||0)+' €$ · '+(def.reward.xp||0)+' XP'+(def.reward.item?' · '+itemById(def.reward.item).name:'')+'</div>';
      if (done) html += '<div class="gig-progress">Completado</div>';
      else if (act) html += '<div class="gig-progress">En curso</div>';
      else html += '<div style="margin-top:8px"><button class="magenta" onclick="acceptQuest(\''+qid+'\')">Aceptar gig</button></div>';
      html += '</div>';
    });
    html += '</div>';
  });
  main.innerHTML = html;
}

function renderCraft(main) {
  var html = '<div class="subtabs">'+
    '<button class="'+(craftSub==='disassemble'?'active':'')+'" onclick="craftSub=\'disassemble\';render()">Desguazar</button>'+
    '<button class="'+(craftSub==='craft'?'active':'')+'" onclick="craftSub=\'craft\';render()">Fabricar</button></div>';

  html += '<div class="section-label">Componentes</div><div class="comp-bar">';
  [200,201,202,203,204].forEach(function(cid){
    var c = itemById(cid);
    html += '<span class="comp-chip '+rarityClass(c.rarity)+'">'+c.name.replace('Componente ','')+': '+invQty(cid)+'</span>';
  });
  html += '</div>';

  if (craftSub === 'disassemble') {
    html += '<p style="font-size:12px;color:var(--muted);margin:0 0 10px">Desguaza armas o atuendos para obtener <b>1 componente de su rango</b> (común → legendario). Las skills de Técnica pueden dar extras.</p>';
    normalizeInv();
    var gear = P.inv.map(function(s){ return {id:s.id, qty:s.qty, def:itemById(s.id)}; })
      .filter(function(x){ return x.def && (x.def.type==='weapon'||x.def.type==='armor'); });
    if (!gear.length) html += '<div class="empty-state">No tienes armas ni atuendos para desguazar.</div>';
    else {
      html += '<div class="item-list">';
      gear.forEach(function(slot){
        var def = slot.def, eq = (P.equipped.weapon===slot.id||P.equipped.armor===slot.id);
        html += '<div class="item-card"><div class="item-card-top"><div>'+
          '<div class="item-name '+rarityClass(def.rarity)+'">'+def.name+(slot.qty>1?' ×'+slot.qty:'')+(eq?' <span class="equipped-tag">EQUIP</span>':'')+'</div>'+
          '<div class="item-meta">Rango: '+def.rarity+' → '+itemById(RARITY_COMPONENT[def.rarity]||200).name+'</div></div></div>'+
          '<div class="item-actions"><button class="danger" onclick="disassembleItem('+slot.id+')">Desguazar</button></div></div>';
      });
      html += '</div>';
    }
  } else {
    html += '<p style="font-size:12px;color:var(--muted);margin:0 0 10px">Gasta componentes para fabricar equipo. Un tipo de componente por rango.</p>';
    CRAFT_RECIPES.forEach(function(rec){
      var res = itemById(rec.result);
      var isAmmo = rec.result >= 210 && rec.result <= 213;
      var costStr = Object.keys(rec.cost).map(function(cid){
        var need = isAmmo ? rec.cost[cid] : Math.max(1, rec.cost[cid] - (getSkillBonus('craftDiscount')||0));
        var have = invQty(+cid);
        return itemById(+cid).name.replace('Componente ','')+': '+have+'/'+need;
      }).join(' · ');
      var can = canCraft(rec);
      var title = rec.label || res.name;
      html += '<div class="craft-recipe"><div class="item-name '+rarityClass(res.rarity)+'">'+title+'</div>'+
        '<div class="item-meta">'+res.desc+'</div>'+
        '<div class="item-stats-row" style="margin-top:6px"><span class="stat-chip">'+costStr+'</span></div>'+
        '<div class="item-actions" style="margin-top:8px">'+
        (can?'<button class="green" onclick="craftRecipe(\''+rec.id+'\')">Fabricar</button>':'<button disabled>Faltan piezas</button>')+
        '</div></div>';
    });
  }
  main.innerHTML = html;
}

function renderSkills(main) {
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
    '<div style="font-size:14px;font-weight:700;color:var(--magenta)">Árbol de habilidades</div>'+
    '<span class="skill-points-badge">'+(P.skillPoints||0)+' pts</span></div>';
  html += '<div class="skill-cat-tabs">';
  Object.keys(SKILL_TREE).forEach(function(cat){
    html += '<button class="'+(skillCat===cat?'active':'')+'" style="'+(skillCat===cat?'background:var(--magenta);color:#000;border-color:var(--magenta)':'')+'" onclick="skillCat=\''+cat+'\';render()">'+SKILL_TREE[cat].name+'</button>';
  });
  html += '</div>';
  var tree = SKILL_TREE[skillCat];

      '<div class="sk-name">'+n.name+(unlocked?' ✓':'')+'</div>'+
      '<div class="sk-desc">'+n.desc+'</div>'+
      '<div style="font-size:11px;color:var(--gold)">Coste: '+n.cost+' pt'+(n.cost>1?'s':'')+(n.req?' · Requiere: '+n.req:'')+'</div>';
    if (unlocked) html += '<div style="margin-top:6px;font-size:11px;color:var(--green)">Desbloqueada</div>';
    else if (can) html += '<div style="margin-top:8px"><button class="magenta" onclick="unlockSkill(\''+n.id+'\')">Desbloquear</button></div>';
    else html += '<div style="margin-top:6px;font-size:11px;color:var(--muted)">Bloqueada</div>';
    html += '</div>';
  });
  html += '<p style="font-size:11px;color:var(--muted);margin-top:12px">Ganas 1 punto de habilidad al subir de nivel.</p>';
  main.innerHTML = html;
}

    if (!window._storageSub) window._storageSub = 'all';

    }).join('')+'</div>';
    normalizeInv();
    var items = P.storage.map(function(s){ return {id:s.id, qty:s.qty, def:itemById(s.id)}; }).filter(function(x){ return x.def; });
    if (_storageSub !== 'all') items = items.filter(function(x){ return x.def.type === _storageSub; });

});
document.getElementById('btn-settings').addEventListener('click', function(){
  sfxClick(); document.getElementById('vol-sfx').value = Math.round(sfxVol*100);
  document.getElementById('modal-settings').classList.remove('hidden');
});
document.getElementById('btn-close-settings').addEventListener('click', function(){ sfxClick(); document.getElementById('modal-settings').classList.add('hidden'); });
document.getElementById('vol-sfx').addEventListener('input', function(e){
  sfxVol = e.target.value/100; try{ localStorage.setItem('nightcity_vol', sfxVol); }catch(err){}
});
document.getElementById('btn-save').addEventListener('click', function(){
  if (save()) { sfxBuy(); logMsg('Partida guardada.', 'sys'); } else { sfxError(); logMsg('Error al guardar.', 'sys'); }
});
document.getElementById('btn-load').addEventListener('click', function(){
  if (load()) { sfxClick(); logMsg('Partida cargada.', 'sys'); document.getElementById('modal-settings').classList.add('hidden'); document.getElementById('modal-name').classList.add('hidden'); render(); }
  else { sfxError(); logMsg('No hay partida guardada.', 'sys'); }
});
document.getElementById('btn-reset').addEventListener('click', function(){
  if (confirm('¿Reiniciar partida?')) {
    localStorage.removeItem('nightcity_v008');
    localStorage.removeItem('nightcity_v007');
    localStorage.removeItem('nightcity_v006');
    localStorage.removeItem('nightcity_v005');
    location.reload();
  }
});
document.getElementById('btn-start').addEventListener('click', function(){
  var name = (document.getElementById('input-name').value.trim() || 'Runner').slice(0,16);
  P.name = name; P.named = true; P.activeQuests = []; P.completedQuests = [];
  P.skillPoints = 0; P.unlockedSkills = [];
  P.mapView = 'city'; P.viewDistrict = null; P.viewSub = null;
  sfxLevel();
  document.getElementById('modal-name').classList.add('hidden');
  logMsg('Bienvenido a Night City, '+P.name+'.', 'sys');
  logMsg('Entra en un distrito, elige subdistrito y explora. Cuidado con la munición.', 'sys');
  save(); render();
});
document.getElementById('input-name').addEventListener('keydown', function(e){ if (e.key==='Enter') document.getElementById('btn-start').click(); });
document.getElementById('btn-loot-all').addEventListener('click', function(){ sfxClick(); takeAllLoot(); });
document.getElementById('btn-loot-leave').addEventListener('click', function(){ sfxClick(); closeLootModal(); });

(function init(){
  try { var v = localStorage.getItem('nightcity_vol'); if (v!==null) sfxVol = parseFloat(v); } catch(e){}
  var verEl = document.getElementById('settings-version');
  if (verEl) verEl.textContent = VERSION;
  var hasSave = load();
  if (hasSave && P.named && P.name) {
    document.getElementById('modal-name').classList.add('hidden');
    if (!P.log.length) logMsg('De vuelta en las calles, '+P.name+'.', 'sys');
    if (P.pendingLoot) openLootModal();
    render();
  } else {
    document.getElementById('modal-name').classList.remove('hidden');
    P.named = false;
  }
  updateStats();
  setInterval(save, 20000);
})();
</script>
</body>
</html>
