<style>
:root {
  --bg: #050508; --panel: #0c0c14; --line: #00f0ff; --txt: #e0e8ff;
  --accent: #00f0ff; --magenta: #ff2bd6; --danger: #ff3355; --gold: #ffcc33;
  --bar-bg: #12121c; --enemy-bar: #ff3355; --player-bar: #00f0ff;
  --purple: #a855f7; --green: #4ade80;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; margin: 0;
  background: var(--bg); color: var(--txt);
  font-family: 'Segoe UI', system-ui, -apple-system, monospace;
  overflow: hidden; -webkit-user-select: none; user-select: none;
}
button {
  font: inherit; color: var(--accent); background: #0a1520; border: 1px solid var(--line);
  padding: 8px 10px; cursor: pointer; touch-action: manipulation;
  -webkit-tap-highlight-color: transparent; font-size: 12px; border-radius: 3px;
  transition: background .12s, transform .08s;
}
button:active { background: #0e2a3a; transform: scale(0.97); }
button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
button.danger { border-color: var(--danger); color: var(--danger); }
button.magenta { border-color: var(--magenta); color: var(--magenta); }
button.gold { border-color: var(--gold); color: var(--gold); }
button.green { border-color: var(--green); color: var(--green); }
.app {
  display: flex; flex-direction: column; height: 100%; height: 100dvh;
  max-width: 720px; margin: 0 auto; padding: 6px;
  padding-bottom: max(6px, env(safe-area-inset-bottom)); overflow: hidden; position: relative;
}
header {
  display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line);
  padding: 4px 2px 8px; flex-shrink: 0;
}
header .header-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 {
  margin: 0; font-size: 15px; letter-spacing: 1.5px;
  background: linear-gradient(90deg, var(--accent), var(--magenta));
  -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800;
}
.header-actions { display: flex; gap: 4px; align-items: center; }
.btn-icon { width: 36px; min-width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; align-items: center; font-variant-numeric: tabular-nums; }
.stats span { white-space: nowrap; }
.stat-eddies { color: var(--gold); } .stat-hp { color: var(--accent); } .stat-lvl { color: var(--magenta); }
.panel { background: var(--panel); border: 1px solid #1a2a3a; border-radius: 4px; padding: 8px; }
.panel-log { flex-shrink: 0; margin-bottom: 4px; max-height: 78px; overflow-y: auto; }
.panel-main { flex: 1 1 auto; min-height: 0; overflow: hidden; margin-bottom: 4px; display: flex; flex-direction: column; }
.log-title { font-weight: bold; color: var(--accent); font-size: 11px; margin-bottom: 2px; }
#log { font-size: 11px; line-height: 1.35; color: #b0c0d8; }
#log .sys { color: var(--accent); } #log .combat { color: var(--danger); }
#log .loot { color: var(--gold); } #log .quest { color: var(--magenta); }
.bottom-bar { flex-shrink: 0; display: flex; gap: 3px; }
.tabs { display: flex; flex: 1; gap: 2px; overflow-x: auto; }
.tabs button { flex: 1; min-width: 0; padding: 9px 3px; font-size: 10px; white-space: nowrap; }
.tabs button.active { background: var(--accent); color: #000; font-weight: 700; box-shadow: 0 0 12px rgba(0,240,255,0.4); }
.main-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 2px; }
.version-badge { position: absolute; bottom: 2px; right: 6px; font-size: 9px; color: #3a4a5a; pointer-events: none; z-index: 5; }
.district-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.district-card { background: #0a1018; border: 1px solid #1a3040; border-radius: 4px; padding: 10px 8px; cursor: pointer; }
.district-card.current { border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,43,214,0.25); }
.district-name { font-weight: 700; color: var(--accent); font-size: 13px; }
.district-desc { font-size: 10px; color: #8090a8; margin-top: 3px; }
.district-danger { font-size: 10px; margin-top: 4px; }
.danger-low { color: var(--green); } .danger-mid { color: var(--gold); } .danger-high { color: var(--danger); }
.action-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.action-row button { flex: 1; min-width: 90px; }
.combat-screen { text-align: center; }
.combat-title { color: var(--danger); font-size: 16px; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,51,85,0.5); }
.combat-entity { margin: 8px 0; padding: 8px; background: #0a1018; border-radius: 4px; border: 1px solid #1a2a3a; text-align: left; }
.combat-entity.enemy { border-color: #3a1520; } .combat-entity.player { border-color: #0a2a3a; }
.combat-name { font-weight: 700; font-size: 13px; }
.combat-name.enemy { color: var(--danger); } .combat-name.player { color: var(--accent); }
.combat-hp-bar { height: 10px; background: var(--bar-bg); border-radius: 2px; overflow: hidden; margin-top: 4px; border: 1px solid #222; }
.combat-hp-fill { height: 100%; transition: width .25s; }
.combat-hp-fill.enemy { background: var(--enemy-bar); } .combat-hp-fill.player { background: var(--player-bar); }
.combat-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; justify-content: center; }
.combat-actions button { min-width: 100px; padding: 12px 10px; }
.item-list { display: flex; flex-direction: column; gap: 4px; }
.item-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 6px; background: #0a1018; border: 1px solid #1a2a3a; border-radius: 3px; font-size: 12px; gap: 6px; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 600; }
.item-meta { font-size: 10px; color: #7080a0; margin-top: 2px; line-height: 1.35; }
.item-stats { font-size: 10px; color: var(--accent); margin-top: 2px; }
.item-actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.item-actions button { padding: 5px 7px; font-size: 10px; }
.equipped-tag { display: inline-block; font-size: 9px; padding: 1px 4px; border: 1px solid var(--accent); color: var(--accent); border-radius: 2px; margin-left: 4px; }
.rarity-common { color: #a0b0c0; } .rarity-uncommon { color: #4ade80; } .rarity-rare { color: #60a5fa; }
.rarity-epic { color: var(--purple); } .rarity-legendary { color: var(--gold); text-shadow: 0 0 6px rgba(255,204,51,0.4); }
.subtabs { display: flex; gap: 3px; margin-bottom: 8px; flex-wrap: wrap; }
.subtabs button { padding: 6px 9px; font-size: 10px; }
.subtabs button.active { background: var(--magenta); color: #000; border-color: var(--magenta); }
.char-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
.char-stat { background: #0a1018; border: 1px solid #1a2a3a; border-radius: 3px; padding: 8px; text-align: center; }
.char-stat .label { font-size: 10px; color: #7080a0; } .char-stat .value { font-size: 16px; font-weight: 700; color: var(--accent); }
.quest-card { background: #0a1018; border: 1px solid #1a2a3a; border-radius: 4px; padding: 10px; margin-bottom: 6px; }
.quest-title { font-weight: 700; color: var(--magenta); font-size: 13px; }
.quest-desc { font-size: 11px; color: #90a0b8; margin: 4px 0; }
.quest-progress { font-size: 11px; color: var(--gold); } .quest-reward { font-size: 10px; color: #7080a0; margin-top: 4px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
.modal-content { background: var(--panel); border: 2px solid var(--accent); padding: 18px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 40px rgba(0,240,255,0.25); }
.modal-content h2, .modal-content h3 { margin: 0 0 12px; color: var(--accent); }
.hidden { display: none !important; }
.progress-bar { background: var(--bar-bg); border: 1px solid #1a2a3a; height: 8px; border-radius: 2px; overflow: hidden; margin: 4px 0; }
.progress-fill { height: 100%; background: var(--accent); transition: width .3s; }
.loc-header { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.loc-flavor { font-size: 11px; color: #8090a8; margin-bottom: 10px; line-height: 1.4; }
.name-input { width: 100%; padding: 12px; font-size: 16px; background: #0a1520; border: 1px solid var(--line); color: var(--txt); border-radius: 4px; margin: 12px 0; font-family: inherit; text-align: center; }
.name-input:focus { outline: none; border-color: var(--magenta); box-shadow: 0 0 12px rgba(255,43,214,0.3); }
.settings-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; padding: 8px 0; border-bottom: 1px solid #1a2a3a; }
.settings-row label { font-size: 13px; }
input[type=range] { width: 120px; accent-color: var(--accent); }
.chrome-card { background: #0a1018; border: 1px solid #1a2a3a; border-radius: 4px; padding: 10px; margin-bottom: 6px; }
.chrome-card.owned { border-color: #2a4a3a; } .chrome-card.installed { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,240,255,0.2); }
@media (max-width: 400px) { .district-grid { grid-template-columns: 1fr; } .tabs button { font-size: 9px; padding: 8px 2px; } }
</style>
</head>

<script>
const VERSION = '0.0.5';
let audioCtx = null, sfxVol = 0.7;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, volMul) {
  if (sfxVol <= 0) return;
  type = type || 'square'; volMul = volMul || 1;
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(sfxVol * 0.15 * volMul, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { playTone(800, 0.04, 'square', 0.6); }
function sfxTab() { playTone(600, 0.05, 'triangle', 0.5); }
function sfxLoot() { playTone(1200, 0.08, 'sine', 0.7); playTone(1600, 0.1, 'sine', 0.4); }
function sfxHurt() { playTone(120, 0.15, 'sawtooth', 1); }
function sfxHeal() { playTone(500, 0.08, 'sine'); playTone(700, 0.1, 'sine', 0.5); }
function sfxLevel() { playTone(600,0.1,'sine'); setTimeout(function(){playTone(800,0.1,'sine');},80); setTimeout(function(){playTone(1000,0.15,'sine');},160); }
function sfxBuy() { playTone(900, 0.06, 'triangle'); }
function sfxError() { playTone(150, 0.2, 'square', 0.5); }
function sfxWin() { playTone(400,0.08,'sine'); setTimeout(function(){playTone(600,0.1,'sine');},60); setTimeout(function(){playTone(900,0.12,'sine');},140); }
function sfxWeapon(subtype) {
  if (subtype === 'melee') { playTone(220,0.06,'sawtooth',0.9); setTimeout(function(){playTone(180,0.08,'triangle',0.6);},40); }
  else if (subtype === 'smg' || subtype === 'rifle') { playTone(300,0.04,'square',0.7); setTimeout(function(){playTone(280,0.04,'square',0.5);},50); setTimeout(function(){playTone(260,0.05,'square',0.4);},100); }
  else if (subtype === 'shotgun') { playTone(100,0.12,'sawtooth',1); playTone(80,0.15,'square',0.6); }
  else if (subtype === 'tech' || subtype === 'smart') { playTone(900,0.05,'sine',0.8); setTimeout(function(){playTone(700,0.08,'triangle',0.5);},40); }
  else { playTone(350,0.05,'square',0.8); setTimeout(function(){playTone(200,0.06,'triangle',0.4);},30); }
}

function itemById(id) { return ITEMS.find(function(i){ return i.id === id; }); }
function invQty(id) { var it = P.inv.find(function(x){ return x.id === id; }); return it ? it.qty : 0; }
function addItem(id, qty, toStorage) {
  qty = qty || 1; var def = itemById(id); if (!def) return;
  var list = toStorage ? P.storage : P.inv;
  if (def.stackable) {
    var existing = list.find(function(x){ return x.id === id; });
    if (existing) existing.qty += qty; else list.push({ id:id, qty:qty });
  } else { for (var i=0;i<qty;i++) list.push({ id:id, qty:1 }); }
}
function removeItem(id, qty, fromStorage) {
  qty = qty || 1; var list = fromStorage ? P.storage : P.inv;
  var idx = list.findIndex(function(x){ return x.id === id; });
  if (idx < 0) return false;
  if (list[idx].qty > qty) list[idx].qty -= qty; else list.splice(idx, 1);
  return true;
}
function getWeaponDmg() {
  var w = itemById(P.equipped.weapon); var dmg = w ? w.dmg : 4;
  (P.equipped.cyberware || []).forEach(function(cid){ var c = itemById(cid); if (c && c.bonusDmg) dmg += c.bonusDmg; });
  return dmg;
}
function getArmorDef() {
  var a = itemById(P.equipped.armor); var def = a ? a.def : 0;
  (P.equipped.cyberware || []).forEach(function(cid){ var c = itemById(cid); if (c && c.bonusDef) def += c.bonusDef; });
  return def;
}
function getCyberHpBonus() {
  var bonus = 0;
  (P.equipped.cyberware || []).forEach(function(cid){ var c = itemById(cid); if (c && c.bonusHp) bonus += c.bonusHp; });
  return bonus;
}
function recalcMaxHp() {
  P.maxHp = 100 + (P.lvl - 1) * 12 + getCyberHpBonus();
  if (P.hp > P.maxHp) P.hp = P.maxHp;
}
function save() { try { localStorage.setItem('nightcity_v005', JSON.stringify(P)); return true; } catch(e){ return false; } }
function load() {
  try {
    var raw = localStorage.getItem('nightcity_v005'); if (!raw) return false;
    var data = JSON.parse(raw); Object.assign(P, data);
    if (!P.storage) P.storage = []; if (!P.ownedChrome) P.ownedChrome = [];
    if (!P.equipped.cyberware) P.equipped.cyberware = []; if (!P.quests) P.quests = [];
    recalcMaxHp(); return true;
  } catch(e){ return false; }
}
function logMsg(msg, cls) {
  P.log.unshift({ msg:msg, cls:cls||'', t:Date.now() });
  if (P.log.length > 50) P.log.pop();
  renderLog();
}
function renderLog() {
  var el = document.getElementById('log'); if (!el) return;
  el.innerHTML = P.log.slice(0,7).map(function(l){ return '<div class="'+(l.cls||'')+'">'+l.msg+'</div>'; }).join('');
}
function updateStats() {
  document.getElementById('st-hp').textContent = Math.max(0, Math.floor(P.hp));
  document.getElementById('st-maxhp').textContent = P.maxHp;
  document.getElementById('st-lvl').textContent = P.lvl;
  document.getElementById('st-xp').textContent = P.xp;
  document.getElementById('st-maxxp').textContent = P.maxXp;
  document.getElementById('st-eddies').textContent = P.eddies;
  document.getElementById('st-armor').textContent = getArmorDef();
  document.getElementById('xp-bar').style.width = Math.min(100, (P.xp / P.maxXp) * 100) + '%';
  document.getElementById('st-time').textContent = String(P.hours).padStart(2,'0')+':'+String(P.minutes).padStart(2,'0');
}
function addXp(amount) {
  P.xp += amount; logMsg('+'+amount+' XP', 'sys');
  while (P.xp >= P.maxXp) {
    P.xp -= P.maxXp; P.lvl++; P.maxXp = Math.floor(P.maxXp * 1.35);
    recalcMaxHp(); P.hp = P.maxHp; sfxLevel();
    logMsg('¡NIVEL '+P.lvl+'! Max HP aumentado. Night City tiembla un poco más.', 'quest');
    checkQuests();
  }
  updateStats();
}
function heal(amount) { P.hp = Math.min(P.maxHp, P.hp + amount); updateStats(); }
function advanceTime(mins) {
  P.minutes += mins;
  while (P.minutes >= 60) { P.minutes -= 60; P.hours++; }
  if (P.hours >= 24) P.hours -= 24;
  updateStats();
}
function giveStarterQuests() {
  P.quests = QUESTS_POOL.slice(0,4).map(function(q){ return Object.assign({}, q, { progress:0, done:false }); });
}
function acceptNewQuest() {
  var notDone = QUESTS_POOL.filter(function(pq){ return !P.quests.some(function(q){ return q.id === pq.id && q.done; }); });
  var pool = notDone.length ? notDone : QUESTS_POOL;
  var pick = pool[Math.floor(Math.random()*pool.length)];
  if (P.quests.some(function(q){ return q.id === pick.id && !q.done; })) { logMsg('Ese gig ya está activo.', 'sys'); return; }
  var newQ = Object.assign({}, pick, { progress:0, done:false });
  var doneIdx = P.quests.findIndex(function(q){ return q.done; });
  if (doneIdx >= 0) P.quests[doneIdx] = newQ;
  else if (P.quests.length < 5) P.quests.push(newQ);
  else { logMsg('Ya tienes demasiados gigs activos.', 'sys'); return; }
  logMsg('Nuevo gig: '+newQ.title, 'quest'); sfxClick(); save(); render();
}
function checkQuests() {
  P.quests.forEach(function(q){
    if (q.done) return;
    if (q.type === 'level' && P.lvl >= q.target) { q.progress = q.target; completeQuest(q); }
  });
}
function onKill(enemy) {
  var g = enemy.gang || 'other';
  P.kills[g] = (P.kills[g]||0) + 1;
  P.quests.forEach(function(q){
    if (q.done) return;
    if (q.type === 'kill' && q.gang === g) {
      q.progress = Math.min(q.target, (q.progress||0)+1);
      if (q.progress >= q.target) completeQuest(q);
    }
    if (q.type === 'kill_legend' && enemy.legendary) {
      q.progress = Math.min(q.target, (q.progress||0)+1);
      if (q.progress >= q.target) completeQuest(q);
    }
  });
}
function completeQuest(q) {
  if (q.done) return; q.done = true; var r = q.reward;
  if (r.eddies) { P.eddies += r.eddies; logMsg('+'+r.eddies+' €$', 'loot'); }
  if (r.xp) addXp(r.xp);
  if (r.item) { addItem(r.item, r.qty||1); logMsg('Obtenido: '+itemById(r.item).name, 'loot'); }
  sfxWin(); logMsg('GIG COMPLETADO: '+q.title, 'quest'); save();
}

function startCombat(enemyTemplate) {
  var e = Object.assign({}, enemyTemplate);
  e.hp = e.hp + Math.floor(Math.random()*8); e.maxHp = e.hp; e.droppedLoot = [];
  if (e.loot && e.loot.length) {
    var numDrops = 1 + (Math.random() < 0.35 ? 1 : 0);
    var shuffled = e.loot.slice().sort(function(){ return Math.random()-0.5; });
    for (var i=0; i<Math.min(numDrops, shuffled.length); i++) {
      if (Math.random() < 0.75) e.droppedLoot.push(shuffled[i]);
    }
  }
  P.combat = { enemy:e, turn:'player' };
  logMsg('¡Combate! '+e.name+' aparece.', 'combat'); render();
}
function combatAttack() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var e = P.combat.enemy, w = itemById(P.equipped.weapon);
  sfxWeapon(w ? (w.subtype||'pistol') : 'pistol');
  var dmg = Math.max(1, getWeaponDmg() + Math.floor(Math.random()*5) - 1);
  e.hp -= dmg;
  logMsg('Atacas a '+e.name+' con '+(w?w.name:'puños')+' por '+dmg+' de daño.', 'combat');
  if (e.hp <= 0) { endCombat(true); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}
function combatHeal() {
  if (!P.combat || P.combat.turn !== 'player') return;
  var meds = [60,59,55,52,51,53,50,58,54], used = false;
  for (var i=0;i<meds.length;i++) {
    if (invQty(meds[i]) > 0) {
      var it = itemById(meds[i]); removeItem(meds[i],1); heal(it.heal); sfxHeal();
      logMsg('Usas '+it.name+' (+'+it.heal+' HP).', 'sys'); used = true; break;
    }
  }
  if (!used) { sfxError(); logMsg('No tienes estimulantes.', 'sys'); return; }
  P.combat.turn = 'enemy'; setTimeout(enemyTurn, 450); render();
}
function combatFlee() {
  if (!P.combat) return;
  if (Math.random() < 0.55) { logMsg('Escapas por los callejones.', 'sys'); sfxClick(); P.combat = null; advanceTime(5); render(); }
  else { logMsg('¡No puedes escapar!', 'combat'); sfxError(); P.combat.turn = 'enemy'; setTimeout(enemyTurn, 400); render(); }
}
function enemyTurn() {
  if (!P.combat) return;
  var e = P.combat.enemy, raw = e.dmg + Math.floor(Math.random()*4);
  var dmg = Math.max(1, raw - Math.floor(getArmorDef()*0.6));
  P.hp -= dmg; sfxHurt(); logMsg(e.name+' te golpea por '+dmg+' de daño.', 'combat');
  if (P.hp <= 0) {
    P.hp = 0; logMsg('Has caído... Un fixer te arrastra a un ripperdoc. Pierdes eddies.', 'combat');
    P.eddies = Math.max(0, P.eddies - Math.floor(P.eddies*0.15));
    P.hp = Math.floor(P.maxHp*0.4); P.combat = null; advanceTime(60); save(); render(); return;
  }
  P.combat.turn = 'player'; updateStats(); render();
}
function endCombat(won) {
  var e = P.combat.enemy; P.combat = null;
  if (won) {
    sfxWin(); logMsg('Has derrotado a '+e.name+'.', 'combat');
    var gain = e.eddies[0] + Math.floor(Math.random()*(e.eddies[1]-e.eddies[0]+1));
    P.eddies += gain; logMsg('+'+gain+' €$', 'loot'); addXp(12 + e.level*4);
    if (e.droppedLoot && e.droppedLoot.length) {
      e.droppedLoot.forEach(function(lid){
        addItem(lid,1); var def = itemById(lid); logMsg('Loot: '+def.name, 'loot'); sfxLoot();
        if (def && def.type === 'cyberware') {
          P.quests.forEach(function(q){
            if (q.type === 'loot_cyber' && !q.done) {
              q.progress = (q.progress||0)+1;
              if (q.progress >= q.target) completeQuest(q);
            }
          });
        }
      });
    } else logMsg('No llevaba nada útil encima.', 'sys');
    onKill(e); advanceTime(8);
  }
  save(); render();
}

function explore() {
  if (P.combat) return; sfxClick();
  advanceTime(12 + Math.floor(Math.random()*18));
  var dist = DISTRICTS.find(function(d){ return d.id === P.district; });
  var roll = Math.random(), dangerMod = (dist.danger||2)*0.07;
  if (roll < 0.38 + dangerMod) {
    var maxLvl = Math.min(P.lvl+3, 15);
    var pool = ENEMIES.filter(function(e){ return e.level <= maxLvl && e.level >= Math.max(1, P.lvl-3); });
    var enemy = pool[Math.floor(Math.random()*pool.length)] || ENEMIES[0];
    if ((dist.danger >= 5 && Math.random() < 0.14) || Math.random() < 0.06)
      enemy = ENEMIES.find(function(e){ return e.legendary; }) || enemy;
    startCombat(enemy);
  } else if (roll < 0.52) {
    var gain = 12 + Math.floor(Math.random()*45) + dist.danger*6;
    P.eddies += gain; sfxLoot(); logMsg('Encuentras '+gain+' €$ en un cadáver / contenedor.', 'loot'); save(); render();
  } else if (roll < 0.68) {
    var pool = ITEMS.filter(function(i){ return (i.rarity==='common'||i.rarity==='uncommon') && (i.type==='consumable'||i.type==='weapon'||i.type==='armor'); });
    var it = pool[Math.floor(Math.random()*pool.length)];
    addItem(it.id,1); sfxLoot(); logMsg('Encuentras: '+it.name, 'loot'); save(); render();
  } else if (roll < 0.78) { logMsg('Calles vacías... solo el zumbido de los neones y un drone lejano.', 'sys'); render(); }
  else if (roll < 0.88) {
    if (P.eddies >= 40) { P.eddies -= 40; addItem(50,1); logMsg('Un vendedor ambulante te vende un MaxDoc Mk.1 por 40 €$.', 'loot'); sfxBuy(); }
    else logMsg('Un vendedor te ofrece algo, pero no te llega el dinero.', 'sys');
    save(); render();
  } else if (roll < 0.94) { logMsg('Oyes disparos a lo lejos. Prefieres no investigar... esta vez.', 'sys'); render(); }
  else {
    var cheapChrome = [113,112,100,105], cid = cheapChrome[Math.floor(Math.random()*cheapChrome.length)];
    if (!P.ownedChrome.includes(cid) && invQty(cid)===0) { addItem(cid,1); sfxLoot(); logMsg('¡Encuentras chrome abandonado: '+itemById(cid).name+'!', 'loot'); }
    else { var g2 = 30+Math.floor(Math.random()*50); P.eddies += g2; logMsg('Encuentras '+g2+' €$ escondidos.', 'loot'); }
    save(); render();
  }
  updateStats();
}
function restAtMotel() {
  if (P.combat) return;
  if (P.eddies < 40) { sfxError(); logMsg('No tienes suficientes eddies para un motel.', 'sys'); return; }
  P.eddies -= 40; P.hp = P.maxHp; advanceTime(300); sfxHeal();
  logMsg('Descansas en un motel de mala muerte. HP restaurado.', 'sys'); save(); render();
}
function travelTo(id) {
  if (P.combat || id === P.district) return; sfxClick(); P.district = id;
  advanceTime(20 + Math.floor(Math.random()*25));
  var d = DISTRICTS.find(function(x){ return x.id === id; });
  logMsg('Viajas a '+d.name+'.', 'sys');
  if (Math.random() < 0.18) {
    var pool = ENEMIES.filter(function(e){ return e.level <= P.lvl+2; });

function equipItem(id) {
  var def = itemById(id); if (!def) return; sfxClick();
  if (def.type === 'weapon') P.equipped.weapon = id;
  else if (def.type === 'armor') P.equipped.armor = id;
  save(); render();
}
function useItem(id) {
  var def = itemById(id); if (!def || def.type !== 'consumable' || invQty(id)<=0) return;
  removeItem(id,1); heal(def.heal||0); sfxHeal(); logMsg('Usas '+def.name+' (+'+def.heal+' HP).', 'sys'); save(); render();
}
function installChrome(id) {
  var def = itemById(id); if (!def || def.type !== 'cyberware') return;
  if (!P.ownedChrome.includes(id) && invQty(id)===0) { sfxError(); logMsg('No posees ese chrome.', 'sys'); return; }
  if (!P.equipped.cyberware) P.equipped.cyberware = [];
  var sameSlot = P.equipped.cyberware.find(function(cid){ var c=itemById(cid); return c && c.slot===def.slot; });
  if (sameSlot) P.equipped.cyberware = P.equipped.cyberware.filter(function(c){ return c !== sameSlot; });
  if (P.equipped.cyberware.length >= 4) { sfxError(); logMsg('Máximo 4 piezas de chrome. Desinstala una primero.', 'sys'); return; }
  if (!P.equipped.cyberware.includes(id)) {
    P.equipped.cyberware.push(id);
    if (invQty(id)>0) { removeItem(id,1); if (!P.ownedChrome.includes(id)) P.ownedChrome.push(id); }
    recalcMaxHp(); sfxBuy(); logMsg('Chrome instalado: '+def.name+' ('+(def.ability||'')+')', 'sys');
  }
  save(); render();
}
function uninstallChrome(id) {
  if (!P.equipped.cyberware) return;
  P.equipped.cyberware = P.equipped.cyberware.filter(function(c){ return c !== id; });
  if (!P.ownedChrome.includes(id)) P.ownedChrome.push(id);
  recalcMaxHp(); sfxClick(); logMsg('Chrome desinstalado.', 'sys'); save(); render();
}
function buyChrome(id) {
  var def = itemById(id); if (!def) return;
  if (P.ownedChrome.includes(id) || invQty(id)>0) { sfxError(); logMsg('Ya posees ese chrome.', 'sys'); return; }
  if (P.eddies < def.value) { sfxError(); logMsg('No tienes suficientes eddies.', 'sys'); return; }
  P.eddies -= def.value; P.ownedChrome.push(id); sfxBuy();
  logMsg('Chrome adquirido: '+def.name+' (−'+def.value+' €$)', 'loot'); save(); render();
}

function sellItem(id, fromStorage) {
  var def = itemById(id); if (!def) return;
  var qty = fromStorage ? ((P.storage.find(function(x){return x.id===id;})||{}).qty||0) : invQty(id);
  if (qty <= 0) return;
  if (!fromStorage && (P.equipped.weapon===id || P.equipped.armor===id)) { sfxError(); logMsg('No puedes vender algo equipado.', 'sys'); return; }
  if ((P.equipped.cyberware||[]).includes(id)) { sfxError(); logMsg('Desinstala el chrome primero.', 'sys'); return; }
  var price = Math.floor(def.value * 0.4);

function moveToStorage(id) {

});
document.getElementById('btn-save').addEventListener('click', function(){
  if (save()) { sfxBuy(); logMsg('Partida guardada.', 'sys'); } else { sfxError(); logMsg('Error al guardar.', 'sys'); }
});
document.getElementById('btn-load').addEventListener('click', function(){
  if (load()) { sfxClick(); logMsg('Partida cargada.', 'sys'); document.getElementById('modal-settings').classList.add('hidden'); document.getElementById('modal-name').classList.add('hidden'); render(); }
  else { sfxError(); logMsg('No hay partida guardada.', 'sys'); }
});
document.getElementById('btn-reset').addEventListener('click', function(){
  if (confirm('¿Reiniciar partida? Se borrará el progreso actual.')) { localStorage.removeItem('nightcity_v005'); location.reload(); }
});
document.getElementById('btn-start').addEventListener('click', function(){
  var name = (document.getElementById('input-name').value.trim() || 'Runner').slice(0,16);
  P.name = name; P.named = true; giveStarterQuests(); sfxLevel();
  document.getElementById('modal-name').classList.add('hidden');
  logMsg('Bienvenido a Night City, '+P.name+'. Las calles no perdonan.', 'sys');
  logMsg('Explora, acepta gigs, instala chrome y sobrevive.', 'sys');
  save(); render();
});
document.getElementById('input-name').addEventListener('keydown', function(e){ if (e.key==='Enter') document.getElementById('btn-start').click(); });

(function init(){
  try { var v = localStorage.getItem('nightcity_vol'); if (v!==null) sfxVol = parseFloat(v); } catch(e){}
  var hasSave = load();
  if (hasSave && P.named && P.name) {
    document.getElementById('modal-name').classList.add('hidden');
    if (!P.log.length) logMsg('De vuelta en las calles, '+P.name+'.', 'sys');
    render();
  } else {
    document.getElementById('modal-name').classList.remove('hidden');
    P.named = false;
  }
  updateStats();
  setInterval(save, 20000);
})();
</script>
</body>
</html>
